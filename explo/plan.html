<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explo · carte Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --line:#D6DCE6; --line-strong:#B9C2D0;
  --ink:#1A2236; --ink-2:#4A5570; --ink-3:#5F6A85;
  --accent:#1F4FE0; --accent-ink:#FFFFFF; --accent-soft:#E4EAFC;
  --chip-l:90%; --chip-s:75%; --chip-text-l:28%;
  --shadow:0 1px 2px rgba(20,30,60,.06), 0 8px 24px -12px rgba(20,30,60,.18);
  --h-cadrage:258; --h-strategie:222; --h-research:168; --h-ideation:46; --h-prio:22; --h-conception:335; --h-alignement:92; --h-mesure:200;
  --pv-bg:#FFFFFF; --pv-fill:#F6F7FA; --pv-line:#C9D0DC; --pv-ink:#1A2236; --pv-muted:#6B7590; --pv-accent:#1F4FE0; --pv-accent-soft:#E4EAFC; --pv-warn-soft:#FCE4DA;
  --warn-soft:#FFF1E6; --warn-line:#F5C9A8; --warn-text:#8A3B12;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111624; --surface:#1A2133; --surface-2:#222B40; --line:#2E3850; --line-strong:#3E4A66;
  --ink:#EDF0F7; --ink-2:#B4BCCF; --ink-3:#8E99B5;
  --accent:#7C9BFF; --accent-ink:#0E1424; --accent-soft:#26304D;
  --chip-l:24%; --chip-s:35%; --chip-text-l:82%;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --pv-bg:#151B2B; --pv-fill:#1F2739; --pv-line:#3A4560; --pv-ink:#E6EAF3; --pv-muted:#8E99B5; --pv-accent:#7C9BFF; --pv-accent-soft:#26304D; --pv-warn-soft:#46261C;
  --warn-soft:#3A2418; --warn-line:#6B3F22; --warn-text:#FFB59A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:none}
.btn.small{padding:5px 9px;font-size:12px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.plan-wrap{overflow-x:auto}
.plan-table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.plan-table th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-weight:500;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.plan-table td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.plan-table tfoot td{border:0;font-weight:600}
.plan-table .mono{font-size:12.5px;white-space:nowrap}
.g-tip b{display:block;font-weight:600}
.g-tip em{display:block;margin-top:4px;font-style:normal;opacity:.85}
.g-tip{position:fixed;z-index:60;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;max-width:260px;box-shadow:var(--shadow)}
.g-tip.warn{background:var(--warn-text)}
.plan-adjusted{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.plan-adjusted b{color:var(--ink)}
.dur-cell{white-space:nowrap}
.dur-ctl{display:inline-flex;align-items:center;gap:2px}
.dur-ctl button{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink-2);border-radius:6px;cursor:pointer;font-size:13px;line-height:1}
.dur-ctl button:hover{color:var(--ink);border-color:var(--ink-3)}
.dur-ctl b{min-width:52px;text-align:center;font-weight:600}
.risk{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3);white-space:normal}
.risk--tight{color:#9a6a2a}
.risk--hard{color:var(--warn-text);font-weight:600}
/* ---------- la frise ----------
   Axe continu en heures de facilitation. Sa longueur est figee sur le total
   standard : comprimer un atelier ne redessine pas l'echelle, ca decale les
   suivants vers la gauche et ca ouvre du temps libre a la fin. */
.tl{position:relative;min-width:560px}
.tl-axis{position:relative;height:22px;border-bottom:1px solid var(--line);margin-bottom:8px}
.tl-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
.tl-tick span{position:absolute;left:4px;top:2px;white-space:nowrap;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.tl-phase{margin-top:8px;padding:6px 12px;border-radius:8px 8px 0 0;font-size:12.5px;font-weight:600;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 45% var(--chip-text-l))}
.tl-row{position:relative;height:58px;transition:height .12s ease;border-radius:0 0 8px 8px;background:hsl(var(--h) 50% calc(var(--chip-l) + 6%) / .45)}
.tl-grid{position:absolute;inset:0;pointer-events:none}
.tl-grid i{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line);opacity:.65}
.tl-bar{position:absolute;top:7px;height:44px;left:calc(var(--x) * 100%);width:calc(var(--w) * 100%);min-width:54px;border-radius:8px;border:0;padding:5px 9px;text-align:left;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 45% var(--chip-text-l));cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden;transition:left .12s ease,width .12s ease}
.tl-cell.dragging .tl-bar,.tl-cell.sliding .tl-bar{transition:none}
.tl-bar b{position:relative;z-index:1;font-weight:600;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-bar small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.85}
.tl-cell--tight .tl-bar{box-shadow:inset 0 0 0 1.5px #d79a4e}
.tl-cell--hard .tl-bar{box-shadow:inset 0 0 0 1.5px var(--warn-line)}
.tl-row--warn{height:100px}
/* fantome de la duree standard, visible des que l'atelier est comprime */
.tl-ghost{position:absolute;top:7px;height:44px;left:calc(var(--x) * 100%);width:calc(var(--gw) * 100%);border:1px dashed var(--line-strong);border-radius:8px;pointer-events:none;opacity:var(--go,0);transition:opacity .12s}
/* plancher : la ou l'agenda ne tient plus */
.tl-floor{position:absolute;top:2px;bottom:2px;left:calc(var(--fx) * 100%);width:2px;background:var(--warn-line);opacity:0;transition:opacity .12s;pointer-events:none}
.tl-bar:hover ~ .tl-floor,.tl-cell:focus-within .tl-floor,.tl-cell.dragging .tl-floor{opacity:.9}
.tl-grip{position:absolute;top:7px;height:44px;left:calc((var(--x) + var(--w)) * 100%);width:14px;margin-left:-7px;cursor:ew-resize;border-radius:4px;touch-action:none;z-index:2}
.tl-grip::after{content:"";position:absolute;top:50%;left:50%;width:3px;height:18px;margin:-9px 0 0 -1.5px;border-radius:2px;background:hsl(var(--h) 45% var(--chip-text-l));opacity:.35}
.tl-row:hover .tl-grip::after,.tl-grip:focus-visible::after{opacity:.8}
.tl-grip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* le temps libere par la compression, en bout de frise */
.tl-free{position:absolute;top:0;bottom:0;visibility:visible;left:calc(var(--x) * 100%);right:0;border-radius:8px;background:repeating-linear-gradient(135deg,transparent,transparent 5px,var(--line) 5px,var(--line) 6px);display:flex;align-items:center;justify-content:center;pointer-events:none}
.tl-free span{position:absolute;right:6px;white-space:nowrap;font-size:12px;font-weight:600;color:var(--ink-2);background:var(--bg);padding:2px 8px;border-radius:6px}
.tl-freerow{position:relative;height:32px;margin-top:10px}
.tl-segs{position:absolute;left:9px;right:9px;bottom:5px;display:flex;gap:1px;height:4px;border-radius:2px;overflow:hidden;opacity:0;transition:opacity .12s}
.tl-bar:hover .tl-segs,.tl-cell:focus-within .tl-segs,.tl-cell.dragging .tl-segs{opacity:1}
.tl-segs i{background:hsl(var(--h) 45% var(--chip-text-l));opacity:.3;border-radius:1px;min-width:1px}
.tl-segs i.seg-cut{opacity:.5}
.tl-segs i.seg-floor{background:var(--warn-line);opacity:1}
.tl-cell--under .tl-bar{background:repeating-linear-gradient(135deg,hsl(var(--h) var(--chip-s) calc(var(--chip-l) + 2%)),hsl(var(--h) var(--chip-s) calc(var(--chip-l) + 2%)) 6px,hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 4%)) 6px,hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 4%)) 12px);box-shadow:inset 0 0 0 1.5px var(--warn-line)}
.tl-warn{position:absolute;top:58px;left:calc(var(--x) * 100%);display:flex;align-items:center;gap:8px;white-space:nowrap;z-index:3;font-size:11.5px;color:var(--warn-text);background:var(--warn-soft);border:1px solid var(--warn-line);border-radius:8px;padding:4px 6px 4px 9px}
.tl-warn .btn{padding:3px 8px;font-size:11.5px}
.tl-row{overflow:visible}
/* ---------- decor de l'explo ---------- */
body{padding:32px 24px 80px}
.wrap{max-width:1040px;margin:0 auto}
.explo-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin:0 0 18px}
.explo-head h1{font-size:20px;margin:0}
.explo-head p{margin:0;color:var(--ink-3);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.plan-table{width:100%;border-collapse:collapse;font-size:13.5px}
.plan-table th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.plan-table td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.plan-wrap{overflow-x:auto}
.hint{margin:10px 0 0;font-size:12px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap">
  <div class="explo-head">
    <h1>Carte Plan, isolée</h1>
    <p>Données factices. Tirez le bord droit d'une barre : les suivantes se décalent, le temps libéré apparaît au bout.</p>
  </div>
  <div class="card" id="card"></div>
</div>
<script>
const T = [{"id": "kickoff", "name": "Kick-off canvas", "phase": "cadrage", "dur": 2, "who": "PM, tech lead, design, sponsor", "out": "Cadrage signé", "agenda": [{"t": "Poser le pourquoi", "min": 15}, {"t": "But et succès", "min": 25}, {"t": "Périmètre", "min": 30}, {"t": "Risques et rôles", "min": 25}, {"t": "Jalons", "min": 15}, {"t": "Relire à voix haute", "min": 10}], "breaks": "Le hors-périmètre passe à la trappe. Non écrit, il revient en réunion trois semaines plus tard."}, {"id": "teamcanvas", "name": "Team canvas", "phase": "cadrage", "dur": 2, "who": "Toute l’équipe", "out": "Règles de travail partagées", "agenda": [{"t": "Raison d’être", "min": 15}, {"t": "Rôles", "min": 20}, {"t": "Objectifs", "min": 30}, {"t": "Valeurs et règles", "min": 30}, {"t": "Besoins", "min": 15}, {"t": "S’engager", "min": 10}], "breaks": "Les règles de travail sautent. La séance produit de bonnes intentions et aucun changement d’habitude."}, {"id": "impact", "name": "Impact mapping", "phase": "strategie", "dur": 3, "who": "PM, design, tech lead", "out": "But relié aux livrables", "agenda": [{"t": "Le but", "min": 20}, {"t": "Acteurs", "min": 30}, {"t": "Impacts", "min": 40}, {"t": "Livrables", "min": 50}, {"t": "Élaguer", "min": 25}, {"t": "Choisir un chemin", "min": 15}], "breaks": "L’élagage saute. Vous sortez avec une carte complète et aucun chemin choisi."}, {"id": "pitch", "name": "Elevator pitch", "phase": "strategie", "dur": 1, "who": "PM, marketing", "out": "Une phrase que tous répètent", "agenda": [{"t": "Remplir seul", "min": 15}, {"t": "Lire à voix haute", "min": 15}, {"t": "Fusionner", "min": 20}, {"t": "Le dire d’un souffle", "min": 10}], "breaks": "La fusion des propositions saute. Chacun repart avec sa version, le pitch n’existe nulle part."}, {"id": "nnl", "name": "Now / Next / Later", "phase": "prio", "dur": 1.5, "who": "PM, équipe, parties prenantes", "out": "Une feuille de route sans dates", "agenda": [{"t": "Vider la liste", "min": 15}, {"t": "Trier en trois", "min": 25}, {"t": "Plafonner le Now", "min": 25}, {"t": "Nommer les responsables", "min": 15}, {"t": "Fixer la revue", "min": 10}], "breaks": "Le plafond du Now saute. La colonne redevient un backlog et rien n’est arbitré."}];
const PHASES = [
  {id:'cadrage', name:'Cadrage & kick-off', h:'--h-cadrage'},
  {id:'strategie', name:'Stratégie & vision', h:'--h-strategie'},
  {id:'prio', name:'Priorisation & planification', h:'--h-prio'},
];
const U = { dur:'Durée', who:'Participants', out:'Résultat', total:'Total', start:'Début', what:'Atelier',
  planned:'Prévu', refTime:'standard', reset:'Remettre les durées', min:'min', hours:'h', days:'j',
  workshops:n => n > 1 ? 'ateliers' : 'atelier',
  cut:(n, m) => n + ' tombe à ' + m + ' min',
  atFloor:n => n + (n > 1 ? ' étapes réduites au minimum' : ' étape réduite au minimum'),
  reco:h => 'sous la dur\u00e9e conseill\u00e9e de ' + h,
  under:'trop court pour tenir sa promesse',
  drop:'Retirer du plan',
  dropped:n => n + ' retiré du plan',
  freed:h => h + ' libérées',
  hint:'Tirez le bord droit d\u2019une barre. Les flèches du clavier marchent aussi.' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId = (a, id) => a.find(x => x.id === id);
let durOv = {};
const dropped = [];
const ORDER = T.map(t => t.id);

const STEPM = 5;
const stepFor = t => t.dur >= 7 ? 3.5 : STEPM / 60;
const edur = t => durOv[t.id] != null ? durOv[t.id] : t.dur;
const rat = t => edur(t) / t.dur;
const band = r => r >= 0.9 ? 'ok' : r >= 0.7 ? 'tight' : 'hard';
const tooShort = t => edur(t) < recDur(t) - 0.001;
/* Duree minimale conseillee : la somme des planchers d'etapes. En dessous,
   l'atelier n'a plus de quoi produire son resultat. On previent, on n'interdit
   pas : l'utilisateur reste maitre de son creneau, et s'il descend vraiment
   bas, on lui propose plutot de retirer l'atelier. */
const recDur = t => Math.ceil(t.agenda.reduce((s, a) => s + Math.max(STEPM, Math.round(a.min / 2)), 0) / STEPM) * STEPM / 60;
const hardDur = t => Math.max(0.25, t.dur * 0.2);
/* « 1 h 20 » plutot que « 1,3 h » : un facilitateur lit un creneau, pas un decimal */
const fmtDur = h => {
  const m = Math.round(h * 60), H = Math.floor(m / 60), M = m % 60;
  if(m < 60) return m + ' ' + U.min;
  return M ? H + ' ' + U.hours + ' ' + String(M).padStart(2, '0') : H + ' ' + U.hours;
};

function scaleAgenda(agenda, targetMin){
  const ref = agenda.reduce((s, a) => s + a.min, 0);
  const out = agenda.map(a => ({t:a.t, min:a.min, ref:a.min}));
  if(!targetMin || Math.abs(targetMin - ref) < 1){ out.forEach(a => { a.cut = false; }); return out; }
  if(targetMin > ref){ const k = targetMin / ref; out.forEach(a => { a.min = Math.max(1, Math.round(a.min * k)); }); }
  else {
    const floor = a => Math.max(STEPM, Math.round(a.ref / 2));
    const sum = () => out.reduce((s, a) => s + a.min, 0);
    const take = pool => {
      const cap = pool.reduce((s, a) => s + Math.max(0, a.min - floor(a)), 0), need = sum() - targetMin;
      if(cap <= 0 || need <= 0) return;
      const want = Math.min(need, cap);
      pool.forEach(a => { const c = Math.max(0, a.min - floor(a)); if(!c) return; a.min = Math.max(floor(a), a.min - Math.round(want * c / cap)); });
    };
    let big = 0; out.forEach((a, i) => { if(a.ref > out[big].ref) big = i; });
    take(out.filter((a, i) => i !== 0 && i !== out.length - 1 && i !== big));
    take(out);
  }
  const diff = targetMin - out.reduce((s, a) => s + a.min, 0);
  if(diff > 0){ const b = out.reduce((m, a) => a.min > m.min ? a : m, out[0]); b.min += diff; }
  out.forEach(a => { a.cut = a.min < a.ref; });
  return out;
}
/* Nommer une etape suppose que le lecteur connaisse l'agenda. On compte donc
   celles qui touchent leur plancher, et la barre montre lesquelles. */
function floorCount(t, hours){
  const sc = scaleAgenda(t.agenda, Math.round(hours * 60));
  return sc.filter(a => a.min <= Math.max(STEPM, Math.round(a.ref / 2))  && a.cut).length;
}
function segsHtml(t, hours){
  const sc = scaleAgenda(t.agenda, Math.round(hours * 60));
  return sc.map(a => {
    const floor = Math.max(STEPM, Math.round(a.ref / 2));
    return '<i style="flex:' + a.min + '" class="' + (a.min <= floor && a.cut ? 'seg-floor' : a.cut ? 'seg-cut' : '') + '" title="' + esc(a.t + ' · ' + a.min + ' min' + (a.cut ? ' (standard ' + a.ref + ')' : '')) + '"></i>';
  }).join('');
}
function riskFor(t, hours){
  const r = hours / t.dur;
  if(Math.abs(r - 1) < 0.001) return '';
  const pct = Math.round(Math.abs(1 - r) * 100), sign = r < 1 ? '-' : '+';
  if(r > 1) return sign + pct + '%';
  const n = floorCount(t, hours);
  return n ? sign + pct + '% · ' + U.atFloor(n) : sign + pct + '%';
}

/* positions : chaque atelier commence ou le precedent finit */
function layout(){
  let cum = 0;
  return T.map(t => { const x = cum, w = edur(t); cum += w; return {t, x, w}; });
}
const axisHours = () => Math.max(T.reduce((s, t) => s + t.dur, 0), layout().reduce((s, l) => Math.max(s, l.x + l.w), 0));

function render(){
  const slots = layout(), axis = axisHours();
  const total = slots.reduce((s, l) => s + l.w, 0), ref = T.reduce((s, t) => s + t.dur, 0);
  const touched = Object.keys(durOv).length > 0;
  const step = axis <= 8 ? 1 : axis <= 16 ? 2 : 4;
  let ticks = '';
  for(let h = 0; h <= axis + 0.001; h += step) ticks += '<i class="tl-tick" style="left:' + (h / axis * 100).toFixed(3) + '%"><span>' + (h ? fmtDur(h) : '0') + '</span></i>';
  let grid = '';
  for(let h = 0; h <= axis + 0.001; h += step) grid += '<i style="left:' + (h / axis * 100).toFixed(3) + '%"></i>';

  let frise = '<div class="tl" data-axis="' + axis + '"><div class="tl-axis">' + ticks + '</div>';
  PHASES.filter(p => slots.some(s => s.t.phase === p.id)).forEach(p => {
    const warnRow = slots.some(s2 => s2.t.phase === p.id && tooShort(s2.t));
    frise += '<div class="tl-phase" style="--h:var(' + p.h + ')">' + esc(p.name) + '</div><div class="tl-row' + (warnRow ? ' tl-row--warn' : '') + '" style="--h:var(' + p.h + ')"><div class="tl-grid">' + grid + '</div>';
    slots.filter(s => s.t.phase === p.id).forEach(s => {
      const t = s.t, r = rat(t);
      const x = s.x / axis, w = s.w / axis, gw = t.dur / axis, fx = (s.x + recDur(t)) / axis;
      const short = tooShort(t);
      frise += '<div class="tl-cell tl-cell--' + band(r) + (short ? ' tl-cell--under' : '') + '" data-cell="' + t.id + '">'
        + '<div class="tl-ghost" style="--x:' + x.toFixed(5) + ';--gw:' + gw.toFixed(5) + ';--go:' + (r < 0.999 ? 1 : 0) + '"></div>'
        + '<button type="button" class="tl-bar" style="--x:' + x.toFixed(5) + ';--w:' + w.toFixed(5) + '" title="' + esc(t.name) + '"><b>' + esc(t.name) + '</b><small>' + fmtDur(s.w) + '</small><span class="tl-segs">' + segsHtml(t, s.w) + '</span></button>'
        + '<div class="tl-floor" style="--fx:' + fx.toFixed(5) + '"></div>'
        + '<span class="tl-grip" data-grip="' + t.id + '" role="slider" tabindex="0" style="--x:' + x.toFixed(5) + ';--w:' + w.toFixed(5) + '" aria-valuetext="' + esc(fmtDur(s.w)) + '"></span>'
        + (short ? '<div class="tl-warn" style="--x:' + x.toFixed(5) + ';--w:' + w.toFixed(5) + '"><span>' + esc(t.breaks) + '</span><button type="button" class="btn" data-drop="' + t.id + '">' + esc(U.drop) + '</button></div>' : '')
        + '</div>';
    });
    frise += '</div>';
  });
  frise += '<div class="tl-freerow"><div class="tl-free" style="--x:' + (total / axis).toFixed(5) + ';visibility:' + (axis - total > 0.01 ? 'visible' : 'hidden') + '"><span>' + esc(U.freed(fmtDur(Math.max(0, axis - total)))) + '</span></div></div>';
  frise += '</div>';

  const rows = slots.map((s, i) => {
    const t = s.t, r = rat(t), risk = riskFor(t, s.w);
    return '<tr><td class="mono">' + esc(fmtDur(s.x)) + '</td><td><b>' + (i + 1) + '. ' + esc(t.name) + '</b></td>'
      + '<td class="dur-cell"><span class="dur-ctl"><button type="button" data-dur="' + t.id + '" data-d="-1">−</button><b class="mono">' + fmtDur(s.w) + '</b><button type="button" data-dur="' + t.id + '" data-d="1">+</button></span>'
      + (risk ? '<small class="risk risk--' + band(r) + '">' + esc(risk) + '</small>' : '<small class="risk">' + esc(U.refTime) + '</small>') + '</td>'
      + '<td>' + esc(t.who) + '</td><td>' + esc(t.out) + '</td></tr>';
  }).join('');

  document.getElementById('card').innerHTML =
    '<div class="plan-wrap">' + frise + '</div>'
    + (dropped.length ? '<p class="plan-adjusted"><span>' + dropped.map(t => esc(U.dropped(t.name))).join(' · ') + '</span><button type="button" class="btn" data-restore>Remettre</button></p>' : '')
    + (touched ? '<p class="plan-adjusted"><span>' + U.planned + ' <b>' + fmtDur(total) + '</b> · ' + U.refTime + ' ' + fmtDur(ref) + '</span><button type="button" class="btn" data-reset>' + U.reset + '</button></p>' : '')
    + '<div class="plan-wrap" style="margin-top:18px"><table class="plan-table"><thead><tr><th>' + U.start + '</th><th>' + U.what + '</th><th>' + U.dur + '</th><th>' + U.who + '</th><th>' + U.out + '</th></tr></thead><tbody>' + rows + '</tbody>'
    + '<tfoot><tr><td></td><td>' + U.total + '</td><td class="mono">' + fmtDur(total) + '</td><td colspan="2"></td></tr></tfoot></table></div>';
}

/* ---------- le geste : on tire, les suivants glissent ---------- */
let drag = null;
function tip(text, warn, x, y){
  let el = document.getElementById('g-tip');
  if(!el){ el = document.createElement('div'); el.id = 'g-tip'; document.body.appendChild(el); }
  el.className = 'g-tip' + (warn ? ' warn' : '');
  el.innerHTML = text;
  el.style.left = Math.min(window.innerWidth - 270, Math.max(8, x + 14)) + 'px';
  el.style.top = Math.max(8, y - 44) + 'px';
}
const tipHide = () => { const el = document.getElementById('g-tip'); if(el) el.remove(); };
function live(id, hours){
  const axis = +document.querySelector('.tl').dataset.axis;
  let cum = 0, total = 0;
  T.forEach(t => {
    const w = t.id === id ? hours : edur(t);
    const cell = document.querySelector('[data-cell="' + t.id + '"]');
    if(cell){
      const bar = cell.querySelector('.tl-bar'), ghost = cell.querySelector('.tl-ghost'), grip = cell.querySelector('.tl-grip'), floor = cell.querySelector('.tl-floor');
      const x = cum / axis;
      bar.style.setProperty('--x', x.toFixed(5)); bar.style.setProperty('--w', (w / axis).toFixed(5));
      const sm = bar.querySelector('small'); if(sm) sm.textContent = fmtDur(w);
      const sg = bar.querySelector('.tl-segs'); if(sg) sg.innerHTML = segsHtml(t, w);
      grip.style.setProperty('--x', x.toFixed(5)); grip.style.setProperty('--w', (w / axis).toFixed(5));
      ghost.style.setProperty('--x', x.toFixed(5)); ghost.style.setProperty('--gw', (t.dur / axis).toFixed(5));
      ghost.style.setProperty('--go', w < t.dur - 0.001 ? 1 : 0);
      floor.style.setProperty('--fx', ((cum + recDur(t)) / axis).toFixed(5));
      cell.classList.remove('tl-cell--ok', 'tl-cell--tight', 'tl-cell--hard');
      cell.classList.add('tl-cell--' + band(w / t.dur));
      if(t.id !== id) cell.classList.add('sliding');
    }
    cum += w; total = cum;
  });
  const free = document.querySelector('.tl-free');
  if(free){
    const gain = Math.max(0, axis - total);
    free.style.setProperty('--x', (total / axis).toFixed(5));
    free.style.visibility = gain > 0.01 ? 'visible' : 'hidden';
    free.querySelector('span').textContent = U.freed(fmtDur(gain));
  }
}
const commit = (id, hours) => { durOv[id] = Math.round(hours * 60) / 60; render(); };
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest('[data-grip]'); if(!grip) return;
  const t = byId(T, grip.dataset.grip), tl = grip.closest('.tl'), row = grip.closest('.tl-row');
  drag = {t, startX:e.clientX, startDur:edur(t), axis:+tl.dataset.axis, px:row.clientWidth, cell:grip.closest('.tl-cell'), cur:edur(t)};
  drag.cell.classList.add('dragging');
  grip.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if(!drag) return;
  const t = drag.t, step = stepFor(t), reco = recDur(t), hard = hardDur(t);
  let dh = ((e.clientX - drag.startX) / drag.px) * drag.axis;
  let raw = drag.startDur + dh;
  // le seuil conseille accroche : il faut insister d'environ 30 pixels pour passer
  // dessous, pour qu'on ne franchisse jamais la limite par accident
  const stickPx = 30, stickH = (stickPx / drag.px) * drag.axis;
  if(raw < reco && raw > reco - stickH) raw = reco;
  else if(raw <= reco - stickH) raw += stickH;
  const val = Math.max(hard, Math.min(t.dur * 2, Math.round(raw / step) * step));
  drag.cur = val; live(t.id, val);
  const r = val / t.dur;
  const line = r < 0.999 ? riskFor(t, val) : '';
  const tooShort = val < reco - 0.001;
  // La couleur de la bulle repond a une seule regle, sinon elle ne veut rien dire :
  // sombre tant qu'on reste dans le conseille, ambre des qu'on passe dessous.
  const hurts = floorCount(t, val) > 0;
  tip('<b>' + esc(fmtDur(val) + (tooShort ? ' · ' + U.reco(fmtDur(reco)) : line ? ' · ' + line : '')) + '</b>'
    + (tooShort || hurts ? '<em>' + esc(t.breaks) + '</em>' : ''), tooShort, e.clientX, e.clientY);
});
document.addEventListener('pointerup', () => {
  if(!drag) return;
  const d = drag; drag = null; tipHide(); d.cell.classList.remove('dragging');
  if(Math.abs(d.cur - d.startDur) > 0.001) commit(d.t.id, d.cur); else render();
});
document.addEventListener('keydown', e => {
  const grip = e.target.closest && e.target.closest('[data-grip]');
  if(!grip || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  const t = byId(T, grip.dataset.grip), step = stepFor(t) * (e.key === 'ArrowRight' ? 1 : -1);
  e.preventDefault();
  commit(t.id, Math.max(hardDur(t), Math.min(t.dur * 2, edur(t) + step)));
});
document.addEventListener('click', e => {
  const du = e.target.closest('[data-dur]');
  if(du){ const t = byId(T, du.dataset.dur), st = stepFor(t);
    commit(t.id, Math.min(t.dur * 2, Math.max(hardDur(t), edur(t) + (+du.dataset.d) * st))); return; }
  const dp = e.target.closest('[data-drop]');
  if(dp){ const i = T.findIndex(x => x.id === dp.dataset.drop); if(i >= 0){ dropped.push(T[i]); delete durOv[T[i].id]; T.splice(i, 1); render(); } return; }
  if(e.target.closest('[data-restore]')){ T.push(...dropped.splice(0)); T.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id)); render(); return; }
  if(e.target.closest('[data-reset]')){ durOv = {}; T.push(...dropped.splice(0)); T.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id)); render(); }
});
render();
</script>
