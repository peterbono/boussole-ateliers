<html lang="fr">
<head>

<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --line:#D6DCE6; --line-strong:#B9C2D0;
  --ink:#1A2236; --ink-2:#4A5570; --ink-3:#5F6A85;
  --accent:#1F4FE0; --accent-ink:#FFFFFF; --accent-soft:#E4EAFC;
  --chip-l:90%; --chip-s:75%; --chip-text-l:28%;
  --shadow:0 1px 2px rgba(20,30,60,.06), 0 8px 24px -12px rgba(20,30,60,.18);
  --h-cadrage:258; --h-strategie:222; --h-research:168; --h-ideation:46; --h-prio:22; --h-conception:335; --h-alignement:92; --h-mesure:200;
  --pv-bg:#FFFFFF; --pv-fill:#F6F7FA; --pv-line:#C9D0DC; --pv-ink:#1A2236; --pv-muted:#6B7590; --pv-accent:#1F4FE0; --pv-accent-soft:#E4EAFC; --pv-warn-soft:#FCE4DA;
  --warn-soft:#FFF1E6; --warn-line:#F5C9A8; --warn-text:#8A3B12;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111624; --surface:#1A2133; --surface-2:#222B40; --line:#2E3850; --line-strong:#3E4A66;
  --ink:#EDF0F7; --ink-2:#B4BCCF; --ink-3:#8E99B5;
  --accent:#7C9BFF; --accent-ink:#0E1424; --accent-soft:#26304D;
  --chip-l:24%; --chip-s:35%; --chip-text-l:82%;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --pv-bg:#151B2B; --pv-fill:#1F2739; --pv-line:#3A4560; --pv-ink:#E6EAF3; --pv-muted:#8E99B5; --pv-accent:#7C9BFF; --pv-accent-soft:#26304D; --pv-warn-soft:#46261C;
  --warn-soft:#3A2418; --warn-line:#6B3F22; --warn-text:#FFB59A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:none}
.btn.small{padding:5px 9px;font-size:12px}
@media print{.totop{display:none!important}}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.plan-wrap{overflow-x:auto}
.plan-table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.plan-table th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-weight:500;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.plan-table td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.plan-table tfoot td{border:0;font-weight:600}
.plan-table .mono{font-size:12.5px;white-space:nowrap}
.gantt{display:flex;flex-direction:column;min-width:520px}
.g-head,.g-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;align-items:start}
.g-head span{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
.g-phase{margin-top:8px;padding:6px 12px;border-radius:8px 8px 0 0;font-size:12.5px;font-weight:600;letter-spacing:.01em;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 45% var(--chip-text-l))}
.g-row{min-height:46px;padding:6px 0 6px;border-radius:0 0 8px 8px;background:hsl(var(--h) 50% calc(var(--chip-l) + 6%) / .45)}
.g-bar{display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:40px;padding:5px 9px;border-radius:8px;text-align:left;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 45% var(--chip-text-l));border:1px solid hsl(var(--h) 40% calc(var(--chip-l) - 10%));font-size:12px;line-height:1.2;overflow:hidden;transition:transform .12s,box-shadow .12s}
.g-bar b{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-bar small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.8}
.g-bar:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.g-cell{position:relative;width:calc(var(--frac) * 100%);min-width:64px;transition:width .12s ease}
.g-cell.dragging{transition:none}
.g-cell .g-bar{width:100%}
.g-cell--tight .g-bar{box-shadow:inset 0 0 0 1.5px #d79a4e}
.g-cell--hard .g-bar{box-shadow:inset 0 0 0 1.5px var(--warn-line)}
.g-grip{position:absolute;top:0;right:-5px;width:12px;height:100%;cursor:ew-resize;border-radius:0 8px 8px 0;touch-action:none}
.g-grip::after{content:"";position:absolute;top:50%;right:4px;width:3px;height:18px;margin-top:-9px;border-radius:2px;background:currentColor;opacity:.32}
.g-cell:hover .g-grip::after,.g-grip:focus-visible::after{opacity:.75}
.g-grip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.g-tip{position:fixed;z-index:60;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;max-width:260px;box-shadow:var(--shadow)}
.g-tip.warn{background:var(--warn-text)}
.gantt-hint{margin:8px 0 0;font-size:12px;color:var(--ink-3)}
@media print{.g-bar{box-shadow:none}.g-grip,.gantt-hint{display:none}}
.plan-adjusted{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.plan-adjusted b{color:var(--ink)}
.dur-cell{white-space:nowrap}
.dur-ctl{display:inline-flex;align-items:center;gap:2px}
.dur-ctl button{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink-2);border-radius:6px;cursor:pointer;font-size:13px;line-height:1}
.dur-ctl button:hover{color:var(--ink);border-color:var(--ink-3)}
.dur-ctl b{min-width:52px;text-align:center;font-weight:600}
.risk{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3);white-space:normal}
.risk--tight{color:#9a6a2a}
.risk--hard{color:var(--warn-text);font-weight:600}
@media print{
  body{background:#fff;color:#000}
  .hdr,.side,.result-bar,.aside,.steps,.lang{display:none!important}
  .wrap{max-width:none;padding:0}
  .plan{border:0;box-shadow:none;padding:0}
  .plan-table{min-width:0}
}
/* propre a l'explo : de quoi poser la carte au milieu d'une page vide */
body{padding:32px 24px 80px}
.wrap{max-width:1040px;margin:0 auto}
.explo-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin:0 0 18px}
.explo-head h1{font-size:20px;margin:0}
.explo-head p{margin:0;color:var(--ink-3);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.summary-line{margin:0 0 16px}
.summary-line small{display:block;color:var(--ink-2);font-size:13.5px;font-weight:600;margin-bottom:6px}
.summary-line h2{margin:0;font-size:30px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.horizon{display:inline-flex;gap:4px;padding:3px;border-radius:10px;background:var(--surface-2);margin-left:auto}
.horizon button{border:0;background:none;padding:6px 12px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.horizon button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.plan-table{width:100%;border-collapse:collapse;font-size:13.5px}
.plan-table th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.plan-table td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.plan-wrap{overflow-x:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="explo-head">
    <h1>Carte Plan, isolée</h1>
    <p>Données factices. Tirez le bord droit d'une barre, ou les flèches du clavier.</p>
    <span class="horizon" id="horizon">
      <button type="button" data-h="demi" aria-pressed="false">Une session</button>
      <button type="button" data-h="semaine" aria-pressed="true">Une semaine</button>
      <button type="button" data-h="programme" aria-pressed="false">Un programme</button>
    </span>
  </div>
  <div class="card" id="card"></div>
</div>
<script>
const T = [
 {
  "id": "kickoff",
  "name": "Kick-off canvas",
  "phase": "cadrage",
  "dur": 2,
  "who": "PM, tech lead, design, sponsor",
  "out": "Project charter signed off",
  "agenda": [
   {
    "t": "Frame the why",
    "min": 15
   },
   {
    "t": "Goal and success",
    "min": 25
   },
   {
    "t": "Scope and out of scope",
    "min": 30
   },
   {
    "t": "Risks and roles",
    "min": 25
   },
   {
    "t": "Milestones",
    "min": 15
   },
   {
    "t": "Read it back",
    "min": 10
   }
  ]
 },
 {
  "id": "teamcanvas",
  "name": "Team canvas",
  "phase": "cadrage",
  "dur": 2,
  "who": "The whole team",
  "out": "Shared working agreement",
  "agenda": [
   {
    "t": "Purpose",
    "min": 15
   },
   {
    "t": "People and roles",
    "min": 20
   },
   {
    "t": "Common and personal goals",
    "min": 30
   },
   {
    "t": "Values and rules",
    "min": 30
   },
   {
    "t": "Needs",
    "min": 15
   },
   {
    "t": "Commit",
    "min": 10
   }
  ]
 },
 {
  "id": "impact",
  "name": "Impact mapping",
  "phase": "strategie",
  "dur": 3,
  "who": "PM, design, tech lead",
  "out": "Goal mapped to deliverables",
  "agenda": [
   {
    "t": "The goal",
    "min": 20
   },
   {
    "t": "Actors",
    "min": 30
   },
   {
    "t": "Impacts",
    "min": 40
   },
   {
    "t": "Deliverables",
    "min": 50
   },
   {
    "t": "Prune",
    "min": 25
   },
   {
    "t": "Pick one path",
    "min": 15
   }
  ]
 },
 {
  "id": "pitch",
  "name": "Elevator pitch",
  "phase": "strategie",
  "dur": 1,
  "who": "PM, marketing",
  "out": "One sentence everyone repeats",
  "agenda": [
   {
    "t": "Fill the blanks alone",
    "min": 15
   },
   {
    "t": "Read them out",
    "min": 15
   },
   {
    "t": "Merge",
    "min": 20
   },
   {
    "t": "Say it in one breath",
    "min": 10
   }
  ]
 },
 {
  "id": "nnl",
  "name": "Now / Next / Later",
  "phase": "prio",
  "dur": 1.5,
  "who": "PM, team, stakeholders",
  "out": "A roadmap without dates",
  "agenda": [
   {
    "t": "Dump the list",
    "min": 15
   },
   {
    "t": "Sort into three",
    "min": 25
   },
   {
    "t": "Cap the Now",
    "min": 25
   },
   {
    "t": "Name the owners",
    "min": 15
   },
   {
    "t": "Agree the revisit date",
    "min": 10
   }
  ]
 }
];
const PHASES = [
  {id:'cadrage', name:'Cadrage & kick-off', h:'--h-cadrage'},
  {id:'strategie', name:'Stratégie & vision', h:'--h-strategie'},
  {id:'prio', name:'Priorisation & planification', h:'--h-prio'},
];
const UIX = { slotSession:'Session', slotDay:n => 'Jour ' + n, slotWeek:n => 'Semaine ' + n,
  slotWhen:'Quand', slotWhat:'Atelier', dur:'Durée', who:'Participants', out:'Résultat', total:'Total',
  planned:'Prévu', refTime:'standard', resetDur:'Remettre les durées', minutes:'min', min:'min', hours:'h', days:'j',
  workshops:n => n > 1 ? 'ateliers' : 'atelier',
  cutStep:(n, m) => n + ' tombe à ' + m + ' min',
  floorHit:'minimum que l\u2019agenda supporte',
  dragHint:'Tirez le bord droit d\u2019une barre pour changer une durée. Les flèches du clavier marchent aussi.' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId = (arr, id) => arr.find(x => x.id === id);
let horizon = 'semaine';
let durOv = {};

/* ---------- le modele, copie du produit ---------- */
const STEPM = 5;
const stepFor = t => t.dur >= 7 ? 3.5 : STEPM / 60;
const edur = t => durOv[t.id] != null ? durOv[t.id] : t.dur;
const rat = t => edur(t) / t.dur;
const band = r => r >= 0.9 ? 'ok' : r >= 0.7 ? 'tight' : 'hard';
function minDur(t){ return t.agenda.reduce((s, a) => s + Math.max(STEPM, Math.round(a.min / 2)), 0) / 60; }
const fmtHours = h => (h % 1 ? h.toFixed(1).replace('.', ',') : h) + ' ' + UIX.hours;
const fmtDur = h => {
  const d = h / 7;
  if(h >= 7 && Math.abs(h - Math.round(d) * 7) < 0.25) return Math.round(d) + ' ' + UIX.days;
  if(h >= 7) return fmtHours(Math.round(h * 2) / 2);
  return h < 1 ? Math.round(h * 60) + ' ' + UIX.min : fmtHours(h);
};
function scaleAgenda(agenda, targetMin){
  const ref = agenda.reduce((s, a) => s + a.min, 0);
  const out = agenda.map(a => ({t:a.t, min:a.min, ref:a.min}));
  if(!targetMin || !ref || Math.abs(targetMin - ref) < 1){ out.forEach(a => { a.cut = false; }); return out; }
  if(targetMin > ref){
    const k = targetMin / ref;
    out.forEach(a => { a.min = Math.max(1, Math.round(a.min * k)); });
  } else {
    const floor = a => Math.max(STEPM, Math.round(a.ref / 2));
    const sum = () => out.reduce((s, a) => s + a.min, 0);
    const take = pool => {
      const cap = pool.reduce((s, a) => s + Math.max(0, a.min - floor(a)), 0);
      const need = sum() - targetMin;
      if(cap <= 0 || need <= 0) return;
      const want = Math.min(need, cap);
      pool.forEach(a => { const c = Math.max(0, a.min - floor(a)); if(!c) return; a.min = Math.max(floor(a), a.min - Math.round(want * c / cap)); });
    };
    let big = 0; out.forEach((a, i) => { if(a.ref > out[big].ref) big = i; });
    const mid = out.filter((a, i) => i !== 0 && i !== out.length - 1 && i !== big);
    take(mid.length ? mid : out.slice());
    take(out);
  }
  const diff = targetMin - out.reduce((s, a) => s + a.min, 0);
  if(diff > 0){ const b2 = out.reduce((m, a) => a.min > m.min ? a : m, out[0]); b2.min += diff; }
  out.forEach(a => { a.cut = a.min < a.ref; });
  return out;
}
function riskLineFor(t, hours){
  const r = hours / t.dur;
  if(Math.abs(r - 1) < 0.001) return '';
  const pct = Math.round(Math.abs(1 - r) * 100), sign = r < 1 ? '-' : '+';
  if(r > 1) return sign + pct + '%';
  const sc = scaleAgenda(t.agenda, Math.round(hours * 60));
  const worst = sc.reduce((m, a) => (a.ref - a.min) > (m.ref - m.min) ? a : m, sc[0]);
  return worst.ref === worst.min ? sign + pct + '%' : sign + pct + '% · ' + UIX.cutStep(worst.t, worst.min);
}
const riskLine = t => riskLineFor(t, edur(t));

/* ---------- la carte ---------- */
function planSlots(){
  if(horizon === 'demi') return T.map((t, i) => ({label:UIX.slotSession, t, start:i, span:1}));
  if(horizon === 'semaine') return T.map((t, i) => ({label:UIX.slotDay(i + 1), t, start:i, span:1}));
  let week = 0, used = 0;
  return T.map(t => {
    const d = edur(t);
    if(used > 0 && used + d > 6){ week++; used = 0; }
    const slot = {label:UIX.slotWeek(week + 1), t, start:week, span:1};
    used += d; return slot;
  });
}
function ganttHtml(slots){
  const n = slots.reduce((m, s) => Math.max(m, s.start + s.span), 0);
  const cap = horizon === 'programme' ? 6 : Math.max(1, ...slots.map(s => edur(s.t)));
  const cols = Array.from({length:n}, (_, i) => horizon === 'demi' ? UIX.slotSession + ' ' + (i + 1) : horizon === 'semaine' ? UIX.slotDay(i + 1) : UIX.slotWeek(i + 1));
  const phases = PHASES.filter(p => slots.some(s => s.t.phase === p.id));
  let html = '<div class="gantt" style="--n:' + n + '" data-cap="' + cap + '" data-n="' + n + '"><div class="g-head">' + cols.map(c => '<span>' + esc(c) + '</span>').join('') + '</div>';
  phases.forEach(p => {
    html += '<div class="g-phase" style="--h:var(' + p.h + ')">' + esc(p.name) + '</div><div class="g-row" style="--h:var(' + p.h + ')">';
    slots.filter(s => s.t.phase === p.id).forEach(s => {
      const t = s.t, r = rat(t);
      const frac = Math.max(0.16, Math.min(1, edur(t) / (cap * s.span)));
      html += '<div class="g-cell g-cell--' + band(r) + '" style="grid-column:' + (s.start + 1) + ' / span ' + s.span + ';--frac:' + frac.toFixed(4) + '" data-cell="' + t.id + '">'
        + '<button type="button" class="g-bar" title="' + esc(t.name) + '"><b>' + esc(t.name) + '</b><small>' + fmtDur(edur(t)) + '</small></button>'
        + '<span class="g-grip" data-grip="' + t.id + '" role="slider" tabindex="0" aria-valuetext="' + esc(fmtDur(edur(t))) + '" title="' + esc(UIX.dragHint) + '"></span></div>';
    });
    html += '</div>';
  });
  return html + '</div><p class="gantt-hint">' + esc(UIX.dragHint) + '</p>';
}
function render(){
  const slots = planSlots();
  const total = T.reduce((s, t) => s + edur(t), 0);
  const ref = T.reduce((s, t) => s + t.dur, 0);
  const touched = Object.keys(durOv).length > 0;
  const rows = slots.map((s, i) => {
    const t = s.t, r = rat(t), risk = riskLine(t);
    return '<tr><td class="mono">' + esc(s.label) + '</td>'
      + '<td><b>' + (i + 1) + '. ' + esc(t.name) + '</b></td>'
      + '<td class="dur-cell"><span class="dur-ctl"><button type="button" data-dur="' + t.id + '" data-d="-1">−</button><b class="mono">' + fmtDur(edur(t)) + '</b><button type="button" data-dur="' + t.id + '" data-d="1">+</button></span>'
      + (risk ? '<small class="risk risk--' + band(r) + '">' + esc(risk) + '</small>' : '<small class="risk">' + esc(UIX.refTime) + '</small>') + '</td>'
      + '<td>' + esc(t.who) + '</td><td>' + esc(t.out) + '</td></tr>';
  }).join('');
  document.getElementById('card').innerHTML =
    '<div class="summary-line"><small>Post-PMF · lancement de projet</small><h2>' + T.length + ' ' + UIX.workshops(T.length) + ' · ' + fmtDur(total) + '</h2></div>'
    + '<div class="plan-wrap">' + ganttHtml(slots) + '</div>'
    + (touched ? '<p class="plan-adjusted"><span>' + UIX.planned + ' <b>' + fmtDur(total) + '</b> · ' + UIX.refTime + ' ' + fmtDur(ref) + '</span><button type="button" class="btn" data-reset>' + UIX.resetDur + '</button></p>' : '')
    + '<div class="plan-wrap" style="margin-top:18px"><table class="plan-table"><thead><tr><th>' + UIX.slotWhen + '</th><th>' + UIX.slotWhat + '</th><th>' + UIX.dur + '</th><th>' + UIX.who + '</th><th>' + UIX.out + '</th></tr></thead><tbody>' + rows + '</tbody>'
    + '<tfoot><tr><td></td><td>' + UIX.total + '</td><td class="mono">' + fmtDur(total) + '</td><td colspan="2"></td></tr></tfoot></table></div>';
}

/* ---------- le geste ---------- */
let gdrag = null;
function gTip(text, warn, x, y){
  let el = document.getElementById('g-tip');
  if(!el){ el = document.createElement('div'); el.id = 'g-tip'; document.body.appendChild(el); }
  el.className = 'g-tip' + (warn ? ' warn' : '');
  el.textContent = text;
  el.style.left = Math.min(window.innerWidth - 270, Math.max(8, x + 14)) + 'px';
  el.style.top = Math.max(8, y - 44) + 'px';
}
const gTipHide = () => { const el = document.getElementById('g-tip'); if(el) el.remove(); };
function gLive(id, hours){
  const t = byId(T, id), cell = document.querySelector('[data-cell="' + id + '"]');
  if(!cell) return;
  const g = cell.closest('.gantt'), cap = +g.dataset.cap;
  const span = (cell.style.gridColumn.match(/span (\d+)/) || [0, 1])[1];
  cell.style.setProperty('--frac', Math.max(0.16, Math.min(1, hours / (cap * span))).toFixed(4));
  const small = cell.querySelector('small'); if(small) small.textContent = fmtDur(hours);
  cell.classList.remove('g-cell--ok', 'g-cell--tight', 'g-cell--hard');
  cell.classList.add('g-cell--' + band(hours / t.dur));
}
const commit = (id, hours) => { durOv[id] = Math.round(hours * 60) / 60; render(); };
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest('[data-grip]'); if(!grip) return;
  const t = byId(T, grip.dataset.grip), cell = grip.closest('.g-cell'), g = cell.closest('.gantt'), row = cell.parentElement;
  const n = +g.dataset.n, colPx = (row.clientWidth - 6 * (n - 1)) / n;
  gdrag = {t, startX:e.clientX, startDur:edur(t), cap:+g.dataset.cap, colPx, cell, cur:edur(t)};
  cell.classList.add('dragging'); grip.setPointerCapture(e.pointerId); e.preventDefault();
});
document.addEventListener('pointermove', e => {
  if(!gdrag) return;
  const t = gdrag.t, step = stepFor(t), lo = minDur(t);
  const dh = ((e.clientX - gdrag.startX) / gdrag.colPx) * gdrag.cap;
  const val = Math.max(lo, Math.min(t.dur * 2, Math.round((gdrag.startDur + dh) / step) * step));
  gdrag.cur = val; gLive(t.id, val);
  const r = val / t.dur, atFloor = Math.abs(val - lo) < 0.001 && val < t.dur;
  const line = r < 0.999 ? riskLineFor(t, val) : '';
  gTip(fmtDur(val) + (atFloor ? ' · ' + UIX.floorHit : line ? ' · ' + line : ''), r < 0.7, e.clientX, e.clientY);
});
document.addEventListener('pointerup', () => {
  if(!gdrag) return;
  const d = gdrag; gdrag = null; gTipHide(); d.cell.classList.remove('dragging');
  if(Math.abs(d.cur - d.startDur) > 0.001) commit(d.t.id, d.cur); else render();
});
document.addEventListener('keydown', e => {
  const grip = e.target.closest && e.target.closest('[data-grip]');
  if(!grip || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
  const t = byId(T, grip.dataset.grip), step = stepFor(t) * (e.key === 'ArrowRight' ? 1 : -1);
  e.preventDefault();
  commit(t.id, Math.max(minDur(t), Math.min(t.dur * 2, edur(t) + step)));
});
document.addEventListener('click', e => {
  const du = e.target.closest('[data-dur]');
  if(du){ const t = byId(T, du.dataset.dur), st = stepFor(t);
    commit(t.id, Math.min(t.dur * 2, Math.max(minDur(t), edur(t) + (+du.dataset.d) * st))); return; }
  if(e.target.closest('[data-reset]')){ durOv = {}; render(); return; }
  const hz = e.target.closest('[data-h]');
  if(hz){ horizon = hz.dataset.h; [...document.querySelectorAll('[data-h]')].forEach(b => b.setAttribute('aria-pressed', b === hz)); render(); }
});
render();
</script>
