  return outs.length ? `<div class="dep-group"><h4>${esc(u.feedsInto)}</h4><div class="wchips">${outs.map(q => wchip(q)).join('')}</div></div>` : '';
}
function openPreview(id){
  const t = byId(T, id); if(!t) return;
  const ph = byId(PHASES, t.phase), x = tx(t), u = UI();
  track('open_workshop', {id});
  const nav = [['sec-overview', u.navOverview], ['sec-before', u.before], ['sec-prep', u.prep], ['sec-agenda', u.agenda], ['sec-pitfalls', u.pitfalls], ['sec-next', u.nextStep]];
  document.getElementById('dlg-content').innerHTML = `
    <div class="dlg-head" style="--h:var(${ph.h})">
      <div class="dlg-head-row"><span class="chip">${esc(L.phases[ph.id])}</span><button class="close" type="button" data-close aria-label="${esc(u.close)}">${ICON.x}</button></div>
      <nav class="dlg-nav" aria-label="Sections">${nav.map(([id, n]) => `<a href="#${id}" data-jump="${id}">${esc(n)}</a>`).join('')}</nav>
    </div>
    <div class="dlg-pv" id="dlg-pv" data-id="${t.id}">${previewBlock(t, false)}</div>
    <div class="dlg-body" style="--h:var(${ph.h})">
      <section id="sec-overview">
        <h2 id="dlg-title">${esc(x.name)}</h2>
        <p class="desc">${esc(x.desc)}</p>
        <p class="why"><b>${esc(u.when)}</b> ${esc(x.why)}</p>
        ${metaHtml(t)}
        ${actionsHtml(t, false)}
      </section>
      ${depsHtml(t)}
      <div id="howto-slot"><p class="muted">${esc(u.loading)}</p></div>
      <div class="helpful" id="helpful"><span>${esc(u.helpful)}</span><button class="btn small" type="button" data-helpful="yes">${ICON.up}${esc(u.yes)}</button><button class="btn small" type="button" data-helpful="no">${ICON.down}${esc(u.no)}</button></div>
      <p class="hint"><a href="mailto:floriangouloubi@gmail.com?subject=${encodeURIComponent('Workshop Compass · ' + x.name)}">${esc(u.feedback)}</a></p>
    </div>`;
  dlg.showModal(); document.getElementById('dlg-content').scrollTop = 0;
  loadRun().then(() => { const slot = document.getElementById('howto-slot'); if(slot) slot.innerHTML = howToHtml(t); });
  loadEx().then(() => { const pvEl = document.getElementById('dlg-pv'); if(pvEl && pvEl.dataset.id === t.id) pvEl.innerHTML = previewBlock(t, false); });
}
const zoomDlg = document.getElementById('zoom');
zoomDlg.addEventListener('click', () => zoomDlg.close());
dlg.addEventListener('click', e => {
  const i = e.target.closest('[data-info]'); if(i){ const n = document.getElementById(i.dataset.info); n.hidden = !n.hidden; i.setAttribute('aria-expanded', String(!n.hidden)); return; }
  const z = e.target.closest('[data-zoom]'); if(z){ const t = byId(T, z.dataset.zoom), ex = EX[t.id][lang]; document.getElementById('zoom-content').innerHTML = `<div class="zoom-head"><span class="chip" style="--h:var(${byId(PHASES, t.phase).h})">${esc(tx(t).name)}</span><span class="muted">${esc(UI().pvFilled)} · ${esc(UI().zoomClose)}</span></div>${Preview.renderFilled(LAYOUTS[t.id], ex.blocks, {class:'pv', title:UI().pvFilled})}`; zoomDlg.showModal(); return; }
  const pv = e.target.closest('[data-pv]'); if(pv){ const el = document.getElementById('dlg-pv'), t = byId(T, el.dataset.id); el.innerHTML = previewBlock(t, pv.dataset.pv === 'filled'); if(pv.dataset.pv === 'filled') track('view_example', {id:t.id}); return; }
  const j = e.target.closest('[data-jump]'); if(j){ e.preventDefault(); const el = document.getElementById(j.dataset.jump); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  const h = e.target.closest('[data-helpful]'); if(!h) return;
  const id = document.querySelector('#dlg-title') && document.querySelector('#dlg-title').textContent;
  track('helpful', {answer:h.dataset.helpful, workshop:id}); document.getElementById('helpful').innerHTML = `<span>${esc(UI().thanks)}</span>`;
});
document.addEventListener('click', e => { const a = e.target.closest('a.btn.primary'); if(a) track('open_figjam', {href:a.getAttribute('href')}); });
dlg.addEventListener('change', e => {
  const c = e.target.closest('[data-prep]'); if(!c) return;
  const arr = prepState.get(c.dataset.prep); arr[+c.dataset.i] = c.checked; prepState.set(c.dataset.prep, arr);
});
dlg.addEventListener('click', e => { if(e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if(!o) return;
  const inner = e.target.closest('a, button'); if(inner && inner !== o && o.contains(inner)) return;
  openPreview(o.dataset.open);
});
document.addEventListener('keydown', e => {
  if(e.key !== 'Enter' && e.key !== ' ') return;
  const o = e.target.closest && e.target.closest('[data-open][role="button"]'); if(!o || e.target !== o) return;
  e.preventDefault(); openPreview(o.dataset.open);
});

/* ---------- mode animer ---------- */
const runDlg = document.getElementById('run');
const RUNSTATE = {t:null, c:null, i:0, left:0, timer:null, paused:false, lock:null, over:false};
async function startRun(id){
  const t = byId(T, id); await loadRun(); const c = RUN[id] && RUN[id][lang]; if(!t || !c) return;
  Object.assign(RUNSTATE, {t, c, i:0, paused:false}); track('run_start', {id});
  if(dlg.open) dlg.close();
  runDlg.showModal(); goStep(0);
  try{ RUNSTATE.lock = navigator.wakeLock && await navigator.wakeLock.request('screen'); }catch(e){}
}
function goStep(i){
  const st = RUNSTATE; if(i < 0) return;
  clearInterval(st.timer);
  if(i >= st.c.agenda.length){ renderRun(true); return; }
  st.i = i; st.left = st.c.agenda[i].min * 60; st.paused = false; st.over = false;
  renderRun(); st.timer = setInterval(tick, 1000);
}
function tick(){ const st = RUNSTATE; if(st.paused) return; st.left--; if(st.left === 0){ st.over = true; try{ beep(); }catch(e){} } renderRunClock(); }
function beep(){ const ctx = new (window.AudioContext || window.webkitAudioContext)(); const o = ctx.createOscillator(), g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; g.gain.value = .08; o.start(); o.stop(ctx.currentTime + .25); }
const mmss = s => { const a = Math.abs(s); return (s < 0 ? '-' : '') + String(Math.floor(a / 60)).padStart(2, '0') + ':' + String(a % 60).padStart(2, '0'); };
function renderRunClock(){
  const st = RUNSTATE, el = document.getElementById('run-clock'); if(!el) return;
  el.textContent = mmss(st.left); el.classList.toggle('over', st.left <= 0);
  const total = st.c.agenda[st.i].min * 60, fill = document.getElementById('run-fill'); if(fill) fill.style.width = Math.min(100, 100 * (1 - Math.max(0, st.left) / total)) + '%';
  const up = document.getElementById('run-up'); if(up) up.hidden = st.left > 0;
}
function renderRun(done){
  const st = RUNSTATE, u = UI(), x = tx(st.t), ph = byId(PHASES, st.t.phase), n = st.c.agenda.length;
  if(done){
    clearInterval(st.timer);
    document.getElementById('run-content').innerHTML = `<div class="run-wrap" style="--h:var(${ph.h})">
      <div class="run-top"><span class="chip">${esc(x.name)}</span><button class="btn small" type="button" data-run-exit>${esc(u.runExit)}</button></div>
      <div class="run-main"><p class="run-step">${esc(u.runDone)}</p><h2>${esc(u.runEnd)}</h2><p class="run-desc">${esc(st.c.next)}</p><p class="run-desc"><b>${esc(u.out)}</b> · ${esc(x.out)}</p></div>
      <div class="run-bottom"><button class="btn" type="button" data-run-go="${n - 1}">${esc(u.runPrev)}</button><button class="btn primary" type="button" data-run-exit>${esc(u.runExit)}</button></div>
    </div>`; return;
  }
  const a = st.c.agenda[st.i], pit = st.c.pitfalls[st.i % st.c.pitfalls.length];
  document.getElementById('run-content').innerHTML = `<div class="run-wrap" style="--h:var(${ph.h})">
    <div class="run-top"><span class="chip">${esc(x.name)}</span><span class="mono run-count">${esc(u.runStep(st.i + 1, n))}</span><button class="btn small" type="button" data-run-exit>${esc(u.runExit)}</button></div>
    <div class="run-steps">${st.c.agenda.map((s, k) => `<span class="${k < st.i ? 'past' : k === st.i ? 'now' : ''}" style="flex:${s.min}"></span>`).join('')}</div>
    <div class="run-main">
      <p class="run-step">${esc(u.runStep(st.i + 1, n))} · ${a.min} ${esc(u.minutes)}</p>
      <h2>${esc(a.t)}</h2>
      <p class="run-desc">${esc(a.d)}</p>
      <div class="run-clock-wrap"><div class="run-clock mono" id="run-clock">${mmss(st.left)}</div><div class="run-bar"><div id="run-fill"></div></div><p class="run-up" id="run-up" hidden>${esc(u.runTimeUp)}</p></div>
      <div class="run-tip">${ICON.warn}<div><b>${esc(u.runTip)}</b><p>${esc(pit)}</p></div></div>
    </div>
    <div class="run-bottom">
      <button class="btn" type="button" data-run-go="${st.i - 1}" ${st.i === 0 ? 'disabled' : ''}>${esc(u.runPrev)}</button>
      <button class="btn" type="button" data-run-pause>${esc(st.paused ? u.runResume : u.runPause)}</button>
      <button class="btn primary" type="button" data-run-go="${st.i + 1}">${st.i + 1 >= n ? esc(u.runDone) : esc(u.runNext)}</button>
    </div>
  </div>`;
  renderRunClock();
}
runDlg.addEventListener('click', e => {
  if(e.target.closest('[data-run-exit]') || e.target === runDlg){ clearInterval(RUNSTATE.timer); try{ RUNSTATE.lock && RUNSTATE.lock.release(); }catch(x){} runDlg.close(); return; }
  const g = e.target.closest('[data-run-go]'); if(g){ goStep(+g.dataset.runGo); return; }
  if(e.target.closest('[data-run-pause]')){ RUNSTATE.paused = !RUNSTATE.paused; e.target.closest('[data-run-pause]').textContent = RUNSTATE.paused ? UI().runResume : UI().runPause; }
});
runDlg.addEventListener('close', () => { clearInterval(RUNSTATE.timer); });
document.addEventListener('keydown', e => {
  if(!runDlg.open) return;
  if(e.key === 'ArrowRight'){ goStep(RUNSTATE.i + 1); } else if(e.key === 'ArrowLeft'){ goStep(RUNSTATE.i - 1); } else if(e.key === ' '){ e.preventDefault(); const b = runDlg.querySelector('[data-run-pause]'); if(b) b.click(); }
});
document.addEventListener('click', e => { const r = e.target.closest('[data-run]'); if(r){ e.stopPropagation(); startRun(r.dataset.run); } }, true);

/* ---------- retour en haut ---------- */
const toTop = document.getElementById('totop');
toTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
let toTopRaf = 0;
addEventListener('scroll', () => {
  if(toTopRaf) return;
  toTopRaf = requestAnimationFrame(() => {
    toTopRaf = 0;
    const show = scrollY > 900 && store.get('tab', 'orient') === 'library';
    if(show === !toTop.hidden) return;
    if(show){ toTop.hidden = false; requestAnimationFrame(() => toTop.classList.add('on')); }
    else { toTop.classList.remove('on'); setTimeout(() => { if(!toTop.classList.contains('on')) toTop.hidden = true; }, 200); }
  });
}, {passive:true});

/* ---------- onglets et langue ---------- */
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if(!b) return;
  document.querySelectorAll('.tabs [role=tab]').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'view-' + b.dataset.tab);
  store.set('tab', b.dataset.tab);
});
document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if(!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; L = LANGS[lang]; LAYOUTS = LAYOUT_SETS[lang]; store.set('lang', lang); syncUrl();
  renderAll();
});

/* ---------- boot ---------- */
function footStatic(){
  const u = UI(), fj = document.getElementById('foot-figjam');
  fj.href = FIGJAM.community || '#'; fj.hidden = !FIGJAM.community;
  document.getElementById('foot-mail').href = `mailto:floriangouloubi@gmail.com?subject=${encodeURIComponent('Workshop Compass')}`;
  document.getElementById('foot-copy').innerHTML = `© ${new Date().getFullYear()} <a href="https://www.floriangouloubi.com/" target="_blank" rel="noopener">Florian Gouloubi</a>`;
  const sub = document.getElementById('foot-sub');
  sub.href = SUBSCRIBE_URL || `mailto:floriangouloubi@gmail.com?subject=${encodeURIComponent('Workshop Compass · updates')}&body=${encodeURIComponent(u.foot.updatesBody)}`;
  if(!SUBSCRIBE_URL) sub.removeAttribute('target');
}
function renderAll(){ applyStatic(); footStatic(); briefStatic(); renderQuestions(); renderDiag(); renderResult(); renderFilters(); renderLibrary(); }
renderAll();
let savedTab = store.get('tab', 'orient'); if(savedTab === 'matrix') savedTab = 'library';
if(lib.mode !== 'cards' && lib.mode !== 'list') lib.mode = 'cards';
if(savedTab !== 'orient'){ const b = document.querySelector(`[data-tab="${savedTab}"]`); if(b) b.click(); }
const openId = new URLSearchParams(location.search).get('open'); if(openId && byId(T, openId)) openPreview(openId);
</script>
