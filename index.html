<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workshop Compass</title>
<meta name="description" content="Pick your product stage and what is blocking: get the sequence of workshops to run, a preview of each template and its FigJam board.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --line:#D6DCE6; --line-strong:#B9C2D0;
  --ink:#1A2236; --ink-2:#4A5570; --ink-3:#5F6A85;
  --accent:#1F4FE0; --accent-ink:#FFFFFF; --accent-soft:#E4EAFC;
  --chip-l:90%; --chip-s:75%; --chip-text-l:28%;
  --shadow:0 1px 2px rgba(20,30,60,.06), 0 8px 24px -12px rgba(20,30,60,.18);
  --h-cadrage:258; --h-strategie:222; --h-research:168; --h-ideation:46; --h-prio:22; --h-conception:335; --h-alignement:92; --h-mesure:200;
  --pv-bg:#FFFFFF; --pv-fill:#F6F7FA; --pv-line:#C9D0DC; --pv-ink:#1A2236; --pv-muted:#6B7590; --pv-accent:#1F4FE0; --pv-accent-soft:#E4EAFC; --pv-warn-soft:#FCE4DA;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111624; --surface:#1A2133; --surface-2:#222B40; --line:#2E3850; --line-strong:#3E4A66;
    --ink:#EDF0F7; --ink-2:#B4BCCF; --ink-3:#8E99B5;
    --accent:#7C9BFF; --accent-ink:#0E1424; --accent-soft:#26304D;
    --chip-l:24%; --chip-s:35%; --chip-text-l:82%;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --pv-bg:#151B2B; --pv-fill:#1F2739; --pv-line:#3A4560; --pv-ink:#E6EAF3; --pv-muted:#8E99B5; --pv-accent:#7C9BFF; --pv-accent-soft:#26304D; --pv-warn-soft:#46261C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111624; --surface:#1A2133; --surface-2:#222B40; --line:#2E3850; --line-strong:#3E4A66;
  --ink:#EDF0F7; --ink-2:#B4BCCF; --ink-3:#8E99B5;
  --accent:#7C9BFF; --accent-ink:#0E1424; --accent-soft:#26304D;
  --chip-l:24%; --chip-s:35%; --chip-text-l:82%;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --pv-bg:#151B2B; --pv-fill:#1F2739; --pv-line:#3A4560; --pv-ink:#E6EAF3; --pv-muted:#8E99B5; --pv-accent:#7C9BFF; --pv-accent-soft:#26304D; --pv-warn-soft:#46261C;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
::selection{background:var(--accent);color:var(--accent-ink)}
html{accent-color:var(--accent)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif;text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
svg.pv{display:block;width:100%;height:auto;border-radius:6px}

/* header */
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.hdr h1{font-size:clamp(28px,4vw,40px);font-weight:800;letter-spacing:-.02em}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabs button{padding:8px 14px;border-radius:9px;color:var(--ink-2);font-weight:600;font-size:14px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hdr-right{display:flex;align-items:center;gap:10px}
.lang{display:inline-flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px}
.lang button{padding:5px 9px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--ink-3);letter-spacing:.03em}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.view[hidden]{display:none}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:none}
.btn.small{padding:5px 9px;font-size:12px}

/* layout orienter */
.orient{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;margin-top:24px;align-items:start}
@media (max-width:860px){.orient{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.side{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:20px;max-height:100vh;overflow:auto}
@media (max-width:860px){.side{position:static;max-height:none}}
.q{display:flex;flex-direction:column;gap:8px}
.q-label{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13.5px;line-height:1.2;color:var(--ink-2);transition:background .12s,border-color .12s}
.opt:hover{border-color:var(--line-strong);color:var(--ink)}
.opt:active{transform:translateY(1px)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts.stack{flex-direction:column}
.opts.stack .opt{border-radius:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.opts.stack .opt small{font-size:12px;opacity:.75}
.acc{padding:0}
.acc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:14px 18px;border-radius:16px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--surface-2)}
.acc[open] summary{border-radius:16px 16px 0 0;border-bottom:1px solid var(--line)}
.acc .val{grid-column:1;font-size:14px;color:var(--ink);font-weight:500}
.acc .chev{grid-column:2;grid-row:1/3;align-self:center;width:16px;height:16px;color:var(--ink-3);transition:transform .15s}
.acc[open] .chev{transform:rotate(180deg)}
.acc .opts,.acc .checks{padding:12px 14px 14px}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.check:hover{background:var(--surface-2);color:var(--ink)}
.check input{width:16px;height:16px;margin:0;flex:none;accent-color:var(--ink)}
.check input:checked + span{color:var(--ink);font-weight:500}
.reset{align-self:flex-start;font-size:13px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}

/* résultat */
.summary{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.summary h2{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.015em}
.summary p{margin:4px 0 0;color:var(--ink-2)}
.stats{display:flex;gap:18px;font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.steps{display:flex;flex-direction:column;position:relative}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 14px;position:relative;padding-bottom:18px}
.step::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500;background:var(--surface);border:2px solid var(--ink);color:var(--ink);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.card-body{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px 20px;align-items:start}
@media (max-width:700px){.card-body{grid-template-columns:1fr}}
.card-body .pvbtn{display:block;border-radius:8px;border:1px solid var(--line);overflow:hidden;transition:border-color .12s}
.card-body .pvbtn:hover{border-color:var(--accent)}
.card-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-top:12px;border-top:1px dashed var(--line)}
.card-foot .meta{border:0;padding:0;flex:1 1 420px;grid-template-columns:auto auto minmax(0,1fr)}
.card-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.card h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 45% var(--chip-text-l))}
.why{margin:0 0 10px;color:var(--ink);max-width:70ch}
.why b{font-weight:600}
.desc{margin:0;color:var(--ink-2);max-width:70ch}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;padding-top:12px;border-top:1px dashed var(--line);margin:0}
.meta div{font-size:13.5px;color:var(--ink-2)}
.meta dt{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.meta dd{margin:0;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.phase-break{display:flex;align-items:center;gap:10px;margin:6px 0 14px 58px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.phase-break::after{content:"";flex:1;height:1px;background:var(--line)}
.aside{margin-top:26px;padding:16px 18px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.aside h3{font-size:15px;margin-bottom:8px}
.aside ul{margin:0;padding-left:18px;color:var(--ink-2)}
.aside li{margin:3px 0}
.aside li button{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* matrice */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:24px}
.matrix-wrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.matrix{border-collapse:collapse;min-width:960px;width:100%;font-size:13px}
.matrix th,.matrix td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:10px 12px;vertical-align:top;text-align:left}
.matrix th{background:var(--surface-2);font-weight:600;font-size:14px;position:sticky;top:0}
.matrix th small{display:block;font-weight:400;color:var(--ink-3);font-size:12px;margin-top:2px}
.matrix td:first-child,.matrix th:first-child{position:sticky;left:0;background:var(--surface-2);z-index:1;min-width:150px}
.matrix td:last-child,.matrix th:last-child{border-right:0}
.matrix tr:last-child td{border-bottom:0}
.cell{display:flex;flex-direction:column;gap:4px}
.cell button{text-align:left;color:var(--ink-2);text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .12s}
.cell button:hover{color:var(--ink);text-decoration-color:var(--line-strong)}
.cell button.strong{color:var(--ink);font-weight:600}
.legend{font-size:13.5px;color:var(--ink-2);gap:16px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend b{color:var(--ink);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.ink{background:var(--ink)}.dot.grey{background:var(--ink-3)}

/* bibliothèque et cards */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:24px}
.select{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 6px 0 12px;height:36px;font-size:13.5px;color:var(--ink-3)}
.select select{border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:6px 4px;outline:none;max-width:240px;cursor:pointer}
.select:focus-within{border-color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;height:36px;min-width:220px}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:none;font:inherit;color:var(--ink);width:100%;outline:none}
.search input::placeholder{color:var(--ink-3)}
.count{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:18px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tcard .pvbtn{display:block;border-radius:8px;border:1px solid var(--line);overflow:hidden;transition:border-color .12s}
.tcard .pvbtn:hover{border-color:var(--accent)}
.tcard h3{font-size:16px;font-weight:700}
.tcard p{margin:0;color:var(--ink-2);font-size:13.5px}
.tcard .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tcard .stages{font-size:13px;color:var(--ink-3)}
.tcard .stages b{color:var(--ink);font-weight:600}
.tcard .actions{margin-top:auto;padding-top:6px}
.tcard .actions .btn{width:100%;justify-content:center;padding:10px 12px;font-size:13.5px}
.empty{padding:30px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-strong);border-radius:14px}

/* dialog aperçu */
dialog{border:0;border-radius:18px;padding:0;background:var(--surface);color:var(--ink);max-width:min(960px,calc(100vw - 32px));width:100%;box-shadow:0 24px 60px -20px rgba(0,0,0,.45)}
dialog::backdrop{background:rgba(10,14,28,.55)}
.dlg{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:0}
@media (max-width:760px){.dlg{grid-template-columns:1fr}}
.dlg-pv{padding:20px;background:var(--surface-2);border-radius:18px 0 0 18px}
@media (max-width:760px){.dlg-pv{border-radius:18px 18px 0 0}}
.dlg-pv svg{border:1px solid var(--line);background:var(--pv-bg)}
.dlg-body{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.dlg-body h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.dlg-body .close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.dlg-body .close:hover{background:var(--surface-2)}
.dlg-body .meta{border-top:1px dashed var(--line)}
.hint{font-size:13px;color:var(--ink-3);margin:0}
.muted{color:var(--ink-3)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;font-size:12.5px}
.reasons .rl{color:var(--ink-3);margin-right:2px}
.reasons .rs{padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-weight:500}
.result-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 18px}
.seg{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:9px;gap:2px}
.seg button{padding:5px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.plan-head h3{font-size:18px}
.plan-head p{margin:4px 0 12px}
.plan-wrap{overflow-x:auto}
.plan-table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px}
.plan-table th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-weight:500;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.plan-table td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
.plan-table tfoot td{border:0;font-weight:600}
.plan-table .mono{font-size:12.5px;white-space:nowrap}
.plan-url{font-size:12px;word-break:break-all;margin:12px 0 0}
.howto{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.howto h3{font-size:16px}
.howto h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-weight:500;margin:8px 0 0}
.howto ul,.howto ol{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}
.howto li{margin:3px 0}
.howto p{margin:0;color:var(--ink-2);font-size:14px}
.agenda{list-style:none;padding:0}
.agenda li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;margin:6px 0}
.agenda .amin{font-size:12px;color:var(--ink-3);padding-top:2px;white-space:nowrap}
.agenda b{color:var(--ink);font-weight:600}
.helpful{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:12px}
@media print{
  body{background:#fff;color:#000}
  .hdr,.side,.result-bar,.aside,.steps,.lang{display:none!important}
  .wrap{max-width:none;padding:0}
  .plan{border:0;box-shadow:none;padding:0}
  .plan-table{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <h1 id="site-title">Workshop Compass</h1>
    <div class="hdr-right">
      <nav class="tabs" role="tablist" aria-label="Views">
        <button role="tab" aria-selected="true" data-tab="orient" data-ui="tabs.orient">Guide me</button>
        <button role="tab" aria-selected="false" data-tab="matrix" data-ui="tabs.matrix">Matrix</button>
        <button role="tab" aria-selected="false" data-tab="library" data-ui="tabs.library">Library</button>
      </nav>
      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="fr" aria-pressed="false">FR</button></div>
    </div>
  </header>

  <section class="view" id="view-orient" role="tabpanel">
    <div class="orient">
      <aside class="side">
        <details class="panel q acc" id="acc-stage"><summary><span class="q-label" data-ui="q.stage"></span><span class="val" data-val="stage"></span><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></summary><div class="opts stack" data-q="stage"></div></details>
        <div class="panel q"><div class="q-label" data-ui="q.team"></div><div class="opts" data-q="team"></div></div>
        <details class="panel q acc" id="acc-trigger"><summary><span class="q-label" data-ui="q.trigger"></span><span class="val" data-val="trigger"></span><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></summary><div class="opts stack" data-q="trigger"></div></details>
        <details class="panel q acc" id="acc-goals"><summary><span class="q-label" data-ui="q.goals"></span><span class="val" data-val="goals"></span><svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></summary><div class="checks" data-q="goals"></div></details>
        <div class="panel q"><div class="q-label" data-ui="q.horizon"></div><div class="opts" data-q="horizon"></div></div>
        <button class="reset" id="reset" data-ui="reset"></button>
      </aside>
      <main id="result"></main>
    </div>
  </section>

  <section class="view" id="view-matrix" role="tabpanel" hidden>
    <div class="toolbar legend"><span data-ui="legendIntro"></span><span><i class="dot ink"></i><b data-ui="legendPrimary"></b></span><span><i class="dot grey"></i><span data-ui="legendSecondary"></span></span></div>
    <div class="matrix-wrap"><table class="matrix" id="matrix"></table></div>
  </section>

  <section class="view" id="view-library" role="tabpanel" hidden>
    <div class="filters" id="filters"></div>
    <div class="grid" id="library"></div>
  </section>
</div>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg" id="dlg-content"></div></dialog>

<script src="data.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/fr.js"></script>
<script src="layouts.en.js"></script>
<script src="layouts.fr.js"></script>
<script src="chain.js"></script>
<script src="preview.js"></script>
<script defer src="/_vercel/insights/script.js"></script>
<script>
/* ---------- langue ---------- */
const LANGS = {en: I18N_EN, fr: I18N_FR};
const LAYOUT_SETS = {en: LAYOUTS_EN, fr: LAYOUTS_FR};
const store = {
  get(k, d){ try{ const v = localStorage.getItem('compass:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('compass:'+k, JSON.stringify(v)); }catch(e){} },
};
const urlLang = new URLSearchParams(location.search).get('lang');
let lang = (urlLang && LANGS[urlLang]) ? urlLang : store.get('lang', 'en');
if(!LANGS[lang]) lang = 'en';
let L = LANGS[lang], LAYOUTS = LAYOUT_SETS[lang];
const UI = () => L.ui;
const tx = t => L.templates[t.id];
const track = (name, data) => { try{ window.va && window.va('event', {name, data}); }catch(e){} };

/* ---------- état ---------- */
const DEFAULT = {stage:'postpmf', team:'s', trigger:'backlog', goals:['prio','align'], horizon:'semaine'};
let ans = Object.assign({}, DEFAULT, store.get('answers', {}));
(function readUrl(){
  const p = new URLSearchParams(location.search), ok = (arr, v) => arr.some(x => x.id === v);
  if(ok(STAGES, p.get('stage'))) ans.stage = p.get('stage');
  if(ok(TEAMS, p.get('team'))) ans.team = p.get('team');
  if(ok(TRIGGERS, p.get('trigger'))) ans.trigger = p.get('trigger');
  if(ok(HORIZONS, p.get('horizon'))) ans.horizon = p.get('horizon');
  if(p.get('goals')){ const g = p.get('goals').split(',').filter(v => ok(GOALS, v)); if(g.length) ans.goals = g; }
})();
let view = store.get('view', 'steps');
function syncUrl(){
  const url = new URL(location.href);
  ['stage','team','trigger','horizon'].forEach(k => url.searchParams.set(k, ans[k]));
  url.searchParams.set('goals', ans.goals.join(','));
  if(lang !== 'en') url.searchParams.set('lang', lang); else url.searchParams.delete('lang');
  url.searchParams.delete('open');
  history.replaceState(null, '', url);
  return url.href;
}
function saveAns(){ store.set('answers', ans); syncUrl(); }
let lib = {phase:'all', stage:'all', q:''};

const byId = (arr, id) => arr.find(x => x.id === id);
const phaseIdx = id => PHASES.findIndex(p => p.id === id);
const stageIdx = id => STAGES.findIndex(s => s.id === id);
const fmtDur = h => h >= 7 ? (Math.round(h/7) + ' ' + UI().days) : (h < 1 ? Math.round(h*60) + ' ' + UI().min : (h % 1 ? (lang === 'fr' ? h.toFixed(1).replace('.', ',') : h.toFixed(1)) : h) + ' ' + UI().hours);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pv = t => Preview.renderPreview(LAYOUTS[t.id], {class:'pv', title:UI().preview(tx(t).name)});
const figjamUrl = t => FIGJAM.file && FIGJAM.nodes[t.id] ? `https://www.figma.com/board/${FIGJAM.file}/${encodeURIComponent(FIGJAM.name)}?node-id=${encodeURIComponent(FIGJAM.nodes[t.id].replace(':', '-'))}` : '';
const ICON = {
  figjam:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h7v7M13 3 7 9"/><path d="M11 9v4H3V5h4"/></svg>',
  x:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  link:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2-2a3 3 0 0 0-4.2-4.2l-1 1"/><path d="M9.5 6.5a3 3 0 0 0-4.2 0l-2 2a3 3 0 0 0 4.2 4.2l1-1"/></svg>',
  print:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6V2h8v4M4 12H2V7h12v5h-2"/><rect x="4" y="10" width="8" height="4"/></svg>',
  up:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7v7H2V7zM5 7l3-5c1 0 2 .7 2 2v3h3.2a1 1 0 0 1 1 1.2l-1 5a1 1 0 0 1-1 .8H5"/></svg>',
  down:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 9V2h3v7zM11 9l-3 5c-1 0-2-.7-2-2V9H2.8a1 1 0 0 1-1-1.2l1-5a1 1 0 0 1 1-.8H11"/></svg>',
};
function actionsHtml(t, small){
  const url = figjamUrl(t), cls = 'btn' + (small ? ' small' : '');
  const fj = url ? `<a class="${cls} primary" href="${url}" target="_blank" rel="noopener">${ICON.figjam}${esc(UI().openFigjam)}</a>`
                 : `<span class="${cls} primary" aria-disabled="true">${ICON.figjam}${esc(UI().figjamSoon)}</span>`;
  return `<div class="actions">${fj}</div>`;
}

/* ---------- moteur ---------- */
function recommend(a){
  const si = stageIdx(a.stage);
  const team = byId(TEAMS, a.team).size;
  const cap = byId(HORIZONS, a.horizon).cap;
  const scored = T.map(t => {
    const fit = t.fit[si];
    if(fit === 0) return null;
    if(t.minTeam && team < t.minTeam) return null;
    let s = fit * 3;
    const gm = t.goals.filter(g => a.goals.includes(g)).length;
    s += Math.min(gm, 2) * 2;
    if(t.triggers.includes(a.trigger)) s += 3;
    if(a.horizon === 'demi' && t.dur > 4) s -= 6;
    if(a.horizon === 'semaine' && t.dur > 8) s -= 3;
    return {t, s, fit};
  }).filter(Boolean);
  scored.sort((x, y) => y.s - x.s || phaseIdx(x.t.phase) - phaseIdx(y.t.phase));
  const min = a.horizon === 'programme' ? 8 : 9;
  let pick = [];
  if(a.horizon === 'programme'){
    PHASES.forEach(p => { const best = scored.find(x => x.t.phase === p.id && x.s >= min); if(best) pick.push(best); });
    scored.forEach(x => { if(pick.length < cap && !pick.includes(x) && x.s >= min) pick.push(x); });
  } else pick = scored.filter(x => x.s >= min).slice(0, cap);
  if(pick.length === 0) pick = scored.slice(0, Math.min(cap, 3));
  pick.sort((x, y) => phaseIdx(x.t.phase) - phaseIdx(y.t.phase) || y.s - x.s);
  // raisons par étape + chaînage
  const ids = pick.map(x => x.t.id), u = UI(), st = L.stages[a.stage].short;
  pick.forEach((x, i) => {
    const r = [];
    r.push(x.fit === 3 ? u.reasons.core(st) : u.reasons.fit(st));
    if(x.t.triggers.includes(a.trigger)) r.push(u.reasons.trigger);
    const g = x.t.goals.filter(g => a.goals.includes(g)).map(g => L.goals[g].toLowerCase());
    if(g.length) r.push(u.reasons.goals(g.join(', ')));
    const feeds = pick.slice(i + 1).find(y => (CHAIN[y.t.id] || {inputs:[]}).inputs.includes(x.t.id));
    if(feeds) r.push(u.reasons.feeds(tx(feeds.t).name));
    const builds = pick.slice(0, i).find(y => (CHAIN[x.t.id] || {inputs:[]}).inputs.includes(y.t.id));
    if(builds && !feeds) r.push(u.reasons.builds(tx(builds.t).name));
    x.reasons = r;
  });
  // prérequis sautés : un input pertinent à ce stade, absent du plan, pour un atelier retenu
  const prereqs = [];
  pick.forEach(x => {
    const ins = (CHAIN[x.t.id] || {inputs:[]}).inputs.filter(id => !ids.includes(id));
    const best = ins.map(id => byId(T, id)).filter(t => t && t.fit[si] >= 2 && !(t.minTeam && team < t.minTeam)).sort((p, q) => q.fit[si] - p.fit[si])[0];
    if(best && !prereqs.some(p => p.from.id === best.id)) prereqs.push({from: best, to: x.t});
  });
  return {pick, scored, prereqs: prereqs.slice(0, 3)};
}

/* ---------- textes statiques ---------- */
function applyStatic(){
  document.documentElement.lang = lang;
  document.title = L.title;
  document.getElementById('site-title').textContent = L.title;
  document.querySelectorAll('[data-ui]').forEach(el => {
    const v = el.dataset.ui.split('.').reduce((o, k) => o && o[k], UI());
    if(typeof v === 'string') el.textContent = v;
  });
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
}

/* ---------- questionnaire ---------- */
function renderQuestions(){
  const mk = (q, list, tex, stack) => {
    document.querySelector(`[data-q="${q}"]`).innerHTML = list.map(o => {
      const x = tex(o); const name = typeof x === 'string' ? x : x.name, hint = typeof x === 'string' ? '' : x.hint;
      return `<button class="opt" type="button" aria-pressed="${ans[q] === o.id}" data-q="${q}" data-id="${o.id}">${esc(name)}${stack && hint ? `<small>${esc(hint)}</small>` : ''}</button>`;
    }).join('');
  };
  mk('stage', STAGES, o => L.stages[o.id], true); mk('team', TEAMS, o => L.teams[o.id], false); mk('trigger', TRIGGERS, o => L.triggers[o.id], true); mk('horizon', HORIZONS, o => L.horizons[o.id], false);
  document.querySelector('[data-q="goals"]').innerHTML = GOALS.map(g => `<label class="check"><input type="checkbox" id="goal-${g.id}" data-goal="${g.id}" ${ans.goals.includes(g.id) ? 'checked' : ''}><span>${esc(L.goals[g.id])}</span></label>`).join('');
  document.querySelector('[data-val="stage"]').textContent = L.stages[ans.stage].name;
  document.querySelector('[data-val="trigger"]').textContent = L.triggers[ans.trigger].name;
  const gs = ans.goals.map(id => L.goals[id]);
  document.querySelector('[data-val="goals"]').textContent = gs.length > 2 ? `${gs.slice(0, 2).join(', ')} +${gs.length - 2}` : gs.join(', ');
}
document.querySelector('.side').addEventListener('click', e => {
  const b = e.target.closest('.opt'); if(!b) return;
  ans[b.dataset.q] = b.dataset.id;
  saveAns(); renderQuestions(); renderResult();
  const acc = b.closest('details'); if(acc) acc.open = false;
});
document.querySelector('.side').addEventListener('change', e => {
  const c = e.target.closest('[data-goal]'); if(!c) return;
  const id = c.dataset.goal, i = ans.goals.indexOf(id);
  if(c.checked){ if(i < 0) ans.goals.push(id); } else if(ans.goals.length > 1) ans.goals.splice(i, 1); else { c.checked = true; return; }
  saveAns(); renderQuestions(); renderResult();
});
document.getElementById('reset').addEventListener('click', () => { ans = JSON.parse(JSON.stringify(DEFAULT)); saveAns(); renderQuestions(); renderResult(); });

/* ---------- parcours ---------- */
function metaHtml(t){
  const x = tx(t), u = UI();
  return `<dl class="meta"><div><dt>${esc(u.dur)}</dt><dd>${fmtDur(t.dur)}</dd></div><div><dt>${esc(u.who)}</dt><dd>${esc(x.who)}</dd></div><div><dt>${esc(u.out)}</dt><dd>${esc(x.out)}</dd></div></dl>`;
}
function stepCard(t, n, reasons){
  const ph = byId(PHASES, t.phase), x = tx(t);
  return `<article class="step">
    <div class="num">${n}</div>
    <div class="card" style="--h:var(${ph.h})">
      <div class="card-top"><h3>${esc(x.name)}</h3><span class="chip">${esc(L.phases[ph.id])}</span></div>
      <div class="card-body">
        <div>
          <p class="why"><b>${esc(UI().whyNow)}</b> ${esc(x.why)}</p>
          <p class="desc">${esc(x.desc)}</p>
          ${reasons ? `<p class="reasons"><span class="rl">${esc(UI().whyStep)}</span>${reasons.map(r => `<span class="rs">${esc(r)}</span>`).join('')}</p>` : ''}
        </div>
        <button class="pvbtn" type="button" data-open="${t.id}" aria-label="${esc(UI().preview(x.name))}">${pv(t)}</button>
      </div>
      <div class="card-foot">${metaHtml(t)}${actionsHtml(t, false)}</div>
    </div>
  </article>`;
}
function renderResult(){
  const {pick, scored, prereqs} = recommend(ans);
  const u = UI(), st = L.stages[ans.stage], tr = L.triggers[ans.trigger], hz = L.horizons[ans.horizon];
  const total = pick.reduce((s, x) => s + x.t.dur, 0);
  let html = `<div class="summary">
      <div><h2>${esc(st.name)} · ${esc(tr.name.toLowerCase())}</h2>
      <p>${esc(u.summary(pick.length, hz.toLowerCase()))}</p></div>
      <div class="stats"><span>${esc(u.time)} <b>${fmtDur(total)}</b></span><span>${esc(u.phases)} <b>${new Set(pick.map(x => x.t.phase)).size}</b></span></div>
    </div>
    <div class="result-bar">
      <div class="seg" id="view-seg"><button type="button" aria-pressed="${view === 'steps'}" data-view="steps">${esc(u.viewSteps)}</button><button type="button" aria-pressed="${view === 'plan'}" data-view="plan">${esc(u.viewPlan)}</button></div>
      <div class="actions"><button class="btn small" type="button" id="copy-link">${ICON.link}${esc(u.copyLink)}</button><button class="btn small" type="button" id="print">${ICON.print}${esc(u.print)}</button></div>
    </div>`;
  if(view === 'plan'){
    html += planHtml(pick, total);
  } else {
    html += '<div class="steps">';
    let lastPhase = null;
    pick.forEach((x, i) => {
      if(ans.horizon === 'programme' && x.t.phase !== lastPhase){ html += `<div class="phase-break">${esc(L.phases[x.t.phase])}</div>`; lastPhase = x.t.phase; }
      html += stepCard(x.t, i + 1, x.reasons);
    });
    html += '</div>';
  }
  const si = stageIdx(ans.stage);
  const next = scored.filter(x => !pick.includes(x)).slice(0, 4);
  const skip = T.filter(t => t.fit[si] === 0).slice(0, 6);
  html += `<div class="aside">`;
  if(prereqs.length) html += `<h3>${esc(u.prereq)}</h3><ul>${prereqs.map(p => `<li><button type="button" data-open="${p.from.id}">${esc(tx(p.from).name)}</button> · ${esc(u.prereqHint(tx(p.from).name, tx(p.to).name))}</li>`).join('')}</ul>`;
  if(next.length) html += `<h3${prereqs.length ? ' style="margin-top:14px"' : ''}>${esc(u.more)}</h3><ul>${next.map(x => `<li><button type="button" data-open="${x.t.id}">${esc(tx(x.t).name)}</button></li>`).join('')}</ul>`;
  if(skip.length) html += `<h3 style="margin-top:14px">${esc(u.skip)}</h3><p style="margin:0 0 6px;color:var(--ink-2);font-size:14px">${esc(si <= 1 ? u.tooEarly : u.tooLate)} ${esc(u.forStage(st.short))}</p><ul>${skip.map(t => `<li>${esc(tx(t).name)}</li>`).join('')}</ul>`;
  html += `</div>`;
  document.getElementById('result').innerHTML = html;
}

/* ---------- plan (roadmap partageable) ---------- */
function planSlots(pick){
  // demi : une session ; semaine : un atelier par jour ; programme : répartition sur 6 à 8 semaines, ~1 atelier par semaine, les longs prennent leur place
  const u = UI();
  if(ans.horizon === 'demi') return pick.map(x => ({label:u.slotSession, x}));
  if(ans.horizon === 'semaine') return pick.map((x, i) => ({label:u.slotDay(i + 1), x}));
  let week = 1; return pick.map(x => { const slot = {label:u.slotWeek(week), x}; week += x.t.dur >= 14 ? 2 : 1; return slot; });
}
function planHtml(pick, total){
  const u = UI(), st = L.stages[ans.stage], tr = L.triggers[ans.trigger];
  const rows = planSlots(pick).map((s, i) => { const x = tx(s.x.t); return `<tr><td class="mono">${esc(s.label)}</td><td><b>${i + 1}. ${esc(x.name)}</b><br><span class="muted">${esc(L.phases[s.x.t.phase])}</span></td><td class="mono">${fmtDur(s.x.t.dur)}</td><td>${esc(x.who)}</td><td>${esc(x.out)}</td></tr>`; }).join('');
  return `<section class="plan">
    <div class="plan-head"><h3>${esc(u.planTitle)}</h3><p class="muted">${esc(st.name)} · ${esc(tr.name)} · ${esc(L.horizons[ans.horizon])}</p></div>
    <div class="plan-wrap"><table class="plan-table"><thead><tr><th>${esc(u.slotWhen)}</th><th>${esc(u.slotWhat)}</th><th>${esc(u.dur)}</th><th>${esc(u.who)}</th><th>${esc(u.out)}</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td></td><td>${esc(u.total)}</td><td class="mono">${fmtDur(total)}</td><td colspan="2"></td></tr></tfoot></table></div>
    <p class="muted plan-url">${esc(location.href.split('?')[0])}?${new URL(location.href).searchParams.toString()}</p>
  </section>`;
}
document.getElementById('result').addEventListener('click', e => {
  const v = e.target.closest('[data-view]'); if(v){ view = v.dataset.view; store.set('view', view); renderResult(); return; }
  if(e.target.closest('#copy-link')){ const href = syncUrl(); navigator.clipboard && navigator.clipboard.writeText(href).then(() => { const b = document.getElementById('copy-link'); b.textContent = UI().copied; track('copy_link', {stage:ans.stage, trigger:ans.trigger}); }).catch(() => {}); return; }
  if(e.target.closest('#print')){ window.print(); }
});

/* ---------- matrice ---------- */
function renderMatrix(){
  let html = `<thead><tr><th>${esc(UI().phase)}</th>${STAGES.map(s => `<th>${esc(L.stages[s.id].short)}<small>${esc(L.stages[s.id].hint)}</small></th>`).join('')}</tr></thead><tbody>`;
  PHASES.forEach(p => {
    html += `<tr><td style="--h:var(${p.h})"><span class="chip">${esc(L.phases[p.id])}</span></td>`;
    STAGES.forEach((s, si) => {
      const items = T.filter(t => t.phase === p.id && t.fit[si] >= 2).sort((a, b) => b.fit[si] - a.fit[si]);
      html += `<td><div class="cell">${items.map(t => `<button type="button" class="${t.fit[si] === 3 ? 'strong' : ''}" data-open="${t.id}">${esc(tx(t).name)}</button>`).join('')}</div></td>`;
    });
    html += '</tr>';
  });
  document.getElementById('matrix').innerHTML = html + '</tbody>';
}

/* ---------- bibliothèque ---------- */
function tcard(t, si){
  const ph = byId(PHASES, t.phase), x = tx(t);
  return `<div class="tcard" style="--h:var(${ph.h})">
    <button class="pvbtn" type="button" data-open="${t.id}" aria-label="${esc(UI().preview(x.name))}">${pv(t)}</button>
    <div class="row"><span class="chip">${esc(L.phases[ph.id])}</span></div>
    <h3>${esc(x.name)}</h3>
    <p>${esc(x.desc)}</p>
    <p class="stages">${esc(UI().stagesLabel)} ${STAGES.map((s, i) => t.fit[i] >= 2 ? (t.fit[i] === 3 ? `<b>${esc(L.stages[s.id].short)}</b>` : esc(L.stages[s.id].short)) : null).filter(Boolean).join(' · ')}</p>
    <p class="mono" style="font-size:12px;color:var(--ink-3)">${fmtDur(t.dur)} · ${esc(x.who)}</p>
    ${actionsHtml(t, true)}
  </div>`;
}
function renderFilters(){
  const u = UI();
  const opt = (id, name, cur) => `<option value="${id}"${cur === id ? ' selected' : ''}>${esc(name)}</option>`;
  document.getElementById('filters').innerHTML =
    `<label class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg><input type="search" id="lib-q" placeholder="${esc(u.search)}" value="${esc(lib.q)}" aria-label="${esc(u.search)}"></label>`
    + `<label class="select"><span>${esc(u.filterPhase)}</span><select id="lib-phase">${opt('all', u.all, lib.phase)}${PHASES.map(p => opt(p.id, L.phases[p.id], lib.phase)).join('')}</select></label>`
    + `<label class="select"><span>${esc(u.filterStage)}</span><select id="lib-stage">${opt('all', u.allM, lib.stage)}${STAGES.map(s => opt(s.id, L.stages[s.id].name, lib.stage)).join('')}</select></label>`
    + `<span class="count" id="count"></span>`;
}
document.getElementById('filters').addEventListener('change', e => {
  if(e.target.id === 'lib-phase'){ lib.phase = e.target.value; renderLibrary(); }
  if(e.target.id === 'lib-stage'){ lib.stage = e.target.value; renderLibrary(); }
});
document.getElementById('filters').addEventListener('input', e => { if(e.target.id === 'lib-q'){ lib.q = e.target.value; renderLibrary(); } });
function renderLibrary(){
  const si = lib.stage === 'all' ? -1 : stageIdx(lib.stage);
  const q = lib.q.trim().toLowerCase();
  const list = T.filter(t => (lib.phase === 'all' || t.phase === lib.phase) && (si < 0 || t.fit[si] >= 2)
    && (!q || (tx(t).name + ' ' + tx(t).desc + ' ' + tx(t).out).toLowerCase().includes(q)));
  list.sort((a, b) => phaseIdx(a.phase) - phaseIdx(b.phase) || (si >= 0 ? b.fit[si] - a.fit[si] : 0));
  document.getElementById('count').textContent = list.length + ' / ' + T.length;
  document.getElementById('library').innerHTML = list.map(t => tcard(t, si)).join('') || `<div class="empty">${esc(UI().empty)}</div>`;
}

/* ---------- aperçu (dialog) ---------- */
const dlg = document.getElementById('dlg');
let RUN = null, runPromise = null;
function loadRun(){ if(RUN) return Promise.resolve(RUN); if(!runPromise) runPromise = fetch('content/run.json').then(r => r.ok ? r.json() : {}).then(j => (RUN = j)).catch(() => (RUN = {})); return runPromise; }
const pageUrl = t => (lang === 'fr' ? '/fr/ateliers/' : '/workshops/') + t.id + '/';
function howToHtml(t){
  const u = UI(), c = RUN && RUN[t.id] && RUN[t.id][lang]; if(!c) return '';
  return `<section class="howto">
    <h3>${esc(u.howTo)}</h3>
    <h4>${esc(u.prep)}</h4><ul>${c.prep.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    <h4>${esc(u.agenda)}</h4><ol class="agenda">${c.agenda.map(a => `<li><span class="mono amin">${a.min} ${esc(u.minutes)}</span><div><b>${esc(a.t)}</b><br>${esc(a.d)}</div></li>`).join('')}</ol>
    <h4>${esc(u.pitfalls)}</h4><ul>${c.pitfalls.map(p => `<li>${esc(p)}</li>`).join('')}</ul>
    <h4>${esc(u.nextStep)}</h4><p>${esc(c.next)}</p>
    ${c.source ? `<p class="muted">${esc(u.source)} : ${esc(c.source)}</p>` : ''}
  </section>`;
}
function openPreview(id){
  const t = byId(T, id); if(!t) return;
  const ph = byId(PHASES, t.phase), x = tx(t), u = UI();
  track('open_workshop', {id});
  document.getElementById('dlg-content').innerHTML = `
    <div class="dlg-pv">${Preview.renderPreview(LAYOUTS[t.id], {class:'pv', title:u.preview(x.name)})}</div>
    <div class="dlg-body" style="--h:var(${ph.h})">
      <button class="close" type="button" data-close aria-label="${esc(u.close)}">${ICON.x}</button>
      <span class="chip" style="align-self:flex-start">${esc(L.phases[ph.id])}</span>
      <h2 id="dlg-title">${esc(x.name)}</h2>
      <p class="desc" style="margin:0">${esc(x.desc)}</p>
      <p class="why" style="margin:0"><b>${esc(u.when)}</b> ${esc(x.why)}</p>
      ${metaHtml(t)}
      ${actionsHtml(t, false)}
      <p class="hint">${esc(u.figjamHint)} ${FIGJAM.community ? `<a href="${FIGJAM.community}" target="_blank" rel="noopener">${esc(u.communityLink)}</a> · ` : ''}<a href="${pageUrl(t)}">${esc(u.permalink)}</a></p>
      <div id="howto-slot"><p class="muted">${esc(u.loading)}</p></div>
      <div class="helpful" id="helpful"><span>${esc(u.helpful)}</span><button class="btn small" type="button" data-helpful="yes">${ICON.up}${esc(u.yes)}</button><button class="btn small" type="button" data-helpful="no">${ICON.down}${esc(u.no)}</button></div>
    </div>`;
  dlg.showModal();
  loadRun().then(() => { const slot = document.getElementById('howto-slot'); if(slot) slot.innerHTML = howToHtml(t); });
}
dlg.addEventListener('click', e => {
  const h = e.target.closest('[data-helpful]'); if(!h) return;
  const id = document.querySelector('#dlg-title') && document.querySelector('#dlg-title').textContent;
  track('helpful', {answer:h.dataset.helpful, workshop:id}); document.getElementById('helpful').innerHTML = `<span>${esc(UI().thanks)}</span>`;
});
document.addEventListener('click', e => { const a = e.target.closest('a.btn.primary'); if(a) track('open_figjam', {href:a.getAttribute('href')}); });
dlg.addEventListener('click', e => { if(e.target === dlg || e.target.closest('[data-close]')) dlg.close(); });
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if(o) openPreview(o.dataset.open);
});

/* ---------- onglets et langue ---------- */
document.querySelector('.tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if(!b) return;
  document.querySelectorAll('.tabs [role=tab]').forEach(x => x.setAttribute('aria-selected', x === b));
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'view-' + b.dataset.tab);
  store.set('tab', b.dataset.tab);
});
document.querySelector('.lang').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if(!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang; L = LANGS[lang]; LAYOUTS = LAYOUT_SETS[lang]; store.set('lang', lang); syncUrl();
  renderAll();
});

/* ---------- boot ---------- */
function renderAll(){ applyStatic(); renderQuestions(); renderResult(); renderMatrix(); renderFilters(); renderLibrary(); }
renderAll();
const savedTab = store.get('tab', 'orient');
if(savedTab !== 'orient'){ const b = document.querySelector(`[data-tab="${savedTab}"]`); if(b) b.click(); }
const openId = new URLSearchParams(location.search).get('open'); if(openId && byId(T, openId)) openPreview(openId);
</script>
</body>
</html>
