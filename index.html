<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E9EDF3; --line:#D6DCE6; --line-strong:#B9C2D0;
  --ink:#1A2236; --ink-2:#4A5570; --ink-3:#5F6A85;
  --accent:#1F4FE0; --accent-ink:#FFFFFF; --accent-soft:#E4EAFC;
  --chip-l:90%; --chip-s:75%; --chip-text-l:28%;
  --shadow:0 1px 2px rgba(20,30,60,.06), 0 8px 24px -12px rgba(20,30,60,.18);
  /* Les phases occupent tout le registre pastel : une alerte doit en sortir. */
  --alert-line:#F0B3AA; --alert-text:#B04C3E; --alert-soft:#FFF6F4; --alert-solid:#B04C3E;
  --h-cadrage:258; --h-strategie:222; --h-research:168; --h-ideation:46; --h-prio:22; --h-conception:335; --h-alignement:92; --h-mesure:200;
  --pv-bg:#FFFFFF; --pv-fill:#F6F7FA; --pv-line:#C9D0DC; --pv-ink:#1A2236; --pv-muted:#6B7590; --pv-accent:#1F4FE0; --pv-accent-soft:#E4EAFC; --pv-warn-soft:#FCE4DA;
  --warn-soft:#FFF1E6; --warn-line:#F5C9A8; --warn-text:#8A3B12;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111624; --surface:#1A2133; --surface-2:#222B40; --line:#2E3850; --line-strong:#3E4A66;
    --ink:#EDF0F7; --ink-2:#B4BCCF; --ink-3:#8E99B5;
    --accent:#7C9BFF; --accent-ink:#0E1424; --accent-soft:#26304D;
    --chip-l:24%; --chip-s:35%; --chip-text-l:82%;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --pv-bg:#151B2B; --pv-fill:#1F2739; --pv-line:#3A4560; --pv-ink:#E6EAF3; --pv-muted:#8E99B5; --pv-accent:#7C9BFF; --pv-accent-soft:#26304D; --pv-warn-soft:#46261C;
    --warn-soft:#3A2418; --warn-line:#6B3F22; --warn-text:#FFB59A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111624; --surface:#1A2133; --surface-2:#222B40; --line:#2E3850; --line-strong:#3E4A66;
  --ink:#EDF0F7; --ink-2:#B4BCCF; --ink-3:#8E99B5;
  --accent:#7C9BFF; --accent-ink:#0E1424; --accent-soft:#26304D;
  --chip-l:24%; --chip-s:35%; --chip-text-l:82%;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --pv-bg:#151B2B; --pv-fill:#1F2739; --pv-line:#3A4560; --pv-ink:#E6EAF3; --pv-muted:#8E99B5; --pv-accent:#7C9BFF; --pv-accent-soft:#26304D; --pv-warn-soft:#46261C;
  --warn-soft:#3A2418; --warn-line:#6B3F22; --warn-text:#FFB59A;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
::selection{background:var(--accent);color:var(--accent-ink)}
html{accent-color:var(--accent)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",sans-serif;text-wrap:balance;margin:0;line-height:1.15}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
svg.pv{display:block;width:100%;height:auto;border-radius:6px}

/* header */
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.hdr h1{font-size:clamp(26px,3.6vw,36px);font-weight:800;letter-spacing:-.025em;display:flex;align-items:center;gap:13px;line-height:1}
.hdr h1 .logo{width:1.05em;height:1.05em;flex:none;color:var(--ink);margin-top:-.04em}
.hdr h1 span{display:inline-flex;gap:.28em}
.hdr h1 i{font-style:normal}
.hdr h1 .w2{font-weight:600;color:var(--ink-2)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabs button{padding:8px 14px;border-radius:9px;color:var(--ink-2);font-weight:600;font-size:14px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.hdr-right{display:flex;align-items:center;gap:10px}
@media (max-width:700px){.hdr{align-items:center}}
.lang{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--line-strong);flex:none}
.lang button{color:var(--ink-3);padding:6px 0}
.lang button:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.lang button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.view[hidden]{display:none}

/* boutons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn svg{width:14px;height:14px;flex:none}
.btn.small{padding:5px 9px;font-size:12px}

/* layout orienter */
.orient{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;margin-top:24px;align-items:start}
@media (max-width:860px){.orient{grid-template-columns:minmax(0,1fr)}}
#result{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.side{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:20px;max-height:100vh;overflow:auto;scrollbar-width:none;padding-bottom:20px}
.side::-webkit-scrollbar{display:none}
.side-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-bottom:-8px;padding:0 4px}
.side-title{font-size:13px;font-weight:600;color:var(--ink-2)}
.side-from{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-3)}
.side-from svg{width:13px;height:13px;color:var(--accent);flex:none}
@keyframes panelFill{
  0%{opacity:.35;transform:translateY(8px) scale(.985);background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 0 var(--accent-soft)}
  28%{opacity:1;transform:translateY(0) scale(1);background:var(--accent-soft);border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
  100%{opacity:1;transform:none;background:var(--surface);border-color:var(--line);box-shadow:0 0 0 0 rgba(0,0,0,0)}
}
@keyframes headFill{0%{opacity:0;transform:translateY(-5px)}100%{opacity:1;transform:none}}
@keyframes sparkIn{0%{opacity:0;transform:scale(.4) rotate(-60deg)}60%{opacity:1;transform:scale(1.25) rotate(8deg)}100%{opacity:1;transform:none}}
.side.filling > .side-head{animation:headFill .4s ease both}
.side.filling .side-from svg{animation:sparkIn .5s cubic-bezier(.3,1.4,.5,1) both;animation-delay:.5s}
.side.filling > .panel.q{animation:panelFill .58s cubic-bezier(.22,.7,.3,1) both}
.side.filling > .panel.q:nth-of-type(1){animation-delay:0s}
.side.filling > .panel.q:nth-of-type(2){animation-delay:.11s}
.side.filling > .panel.q:nth-of-type(3){animation-delay:.22s}
.side.filling > .panel.q:nth-of-type(4){animation-delay:.33s}
.side.filling > .panel.q:nth-of-type(5){animation-delay:.44s}
@media (prefers-reduced-motion:reduce){.side.filling > .side-head,.side.filling > .panel.q,.side.filling .side-from svg{animation:none}}
@media (max-width:860px){.side{position:static;max-height:none}}
.q{display:flex;flex-direction:column;gap:8px}
.q-label{display:flex;align-items:baseline;gap:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13.5px;line-height:1.2;color:var(--ink-2);transition:background .12s,border-color .12s}
.opt:hover{border-color:var(--line-strong);color:var(--ink)}
.opt:active{transform:translateY(1px)}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepper{display:flex;flex-direction:column;gap:12px;padding:16px 16px 14px}
.step-track{display:flex;align-items:flex-start;gap:0;position:relative}
.step-track::before{content:"";position:absolute;left:10%;right:10%;top:6px;height:2px;background:var(--line)}
.step-dot{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 2px;min-width:0;position:relative;color:var(--ink-3);font-size:10.5px;line-height:1.2;text-align:center}
.step-dot::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);transition:background .15s,border-color .15s,transform .15s}
.step-dot.past::before{background:var(--line-strong);border-color:var(--line-strong)}
.step-dot.on::before{background:var(--ink);border-color:var(--ink);transform:scale(1.25)}
.step-dot.on{color:var(--ink);font-weight:600}
.step-dot:hover::before{border-color:var(--ink)}
.step-dot span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.step-now{margin:0;font-size:12.5px;line-height:1.45;color:var(--ink-3)}
.opts.stack{flex-direction:column}
.opts.stack .opt{border-radius:10px;text-align:left;display:flex;flex-direction:column;gap:1px;padding:10px 13px}
.opts.stack .opt small{font-size:12px;line-height:1.35;color:var(--ink-3);font-weight:400}
.opts.stack .opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.opts.stack .opt[aria-pressed="true"] small{color:var(--bg);opacity:.72}

.brief{margin-top:20px;border-radius:14px;background:var(--surface);border:1px solid var(--line);transition:box-shadow .15s,border-color .15s}
.brief:focus-within{border-color:var(--line-strong);box-shadow:var(--shadow)}
.brief summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 14px;border-radius:14px}
.brief summary::-webkit-details-marker{display:none}
.brief summary:hover{background:var(--surface-2)}
.brief[open] summary{border-radius:14px 14px 0 0;border-bottom:1px solid var(--line)}
.brief .spark{width:16px;height:16px;color:var(--accent);flex:none}
.brief-title{font-size:14px;font-weight:600;color:var(--ink)}
.brief-sub{font-size:13px;color:var(--ink-3);flex:1 1 auto;min-width:0}
.brief .chev{width:16px;height:16px;color:var(--ink-3);transition:transform .15s}
.brief[open] .chev{transform:rotate(180deg)}
.brief-body{display:flex;flex-direction:column;margin:0}
.brief textarea{width:100%;box-sizing:border-box;border:0;padding:14px 16px 6px;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);background:transparent;resize:none;min-height:88px;outline:none}
.brief textarea::placeholder{color:var(--ink-3)}
.brief-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:6px 10px 10px 16px}
.brief-try{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3)}
.brief-try .try{padding:4px 10px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);background:var(--surface)}
.brief-try .try:hover{border-color:var(--line-strong);color:var(--ink)}
.brief-side{display:flex;align-items:center;gap:10px;margin-left:auto}
.brief-msg{font-size:13px;color:var(--ink-3);max-width:320px;text-align:right}
.brief-msg.err{color:var(--warn-text)}
.send{display:inline-flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600;transition:filter .15s,opacity .15s,transform .1s}
.send svg{width:22px;height:22px;padding:4px;border-radius:50%;background:var(--accent-ink);color:var(--accent)}
.send:hover{filter:brightness(1.08)}
.send:active{transform:translateY(1px)}
.send:disabled{opacity:.4;cursor:not-allowed;filter:none}
.readout{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:14px;background:var(--accent-soft);border:1px solid var(--line);margin-bottom:16px;font-size:14px}
.readout-head{display:flex;align-items:center;gap:8px}
.readout .spark{width:16px;height:16px;color:var(--accent);flex:none}
.readout-k{flex:1 1 auto;min-width:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.readout-x{flex:none;display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin:-4px -6px -4px 0;border-radius:8px;color:var(--ink-3);transition:background .12s,color .12s}
.readout-x:hover{background:var(--surface);color:var(--ink)}
.readout-x svg{width:14px;height:14px}
.readout p{margin:0;color:var(--ink)}
.readout .readout-set-note{font-size:13px;color:var(--ink-2)}
.readout .pins{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.acc{padding:0}
.acc summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:14px 18px;border-radius:16px}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--surface-2)}
.acc[open] summary{border-radius:16px 16px 0 0;border-bottom:1px solid var(--line)}
.acc .val{grid-column:1;font-size:14px;color:var(--ink);font-weight:500}
.acc .chev{grid-column:2;grid-row:1/3;align-self:center;width:16px;height:16px;color:var(--ink-3);transition:transform .15s}
.acc[open] .chev{transform:rotate(180deg)}
.acc .opts,.acc .checks{padding:12px 14px 14px}
.checks{display:flex;flex-direction:column;gap:2px}
.check{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.check:hover{background:var(--surface-2);color:var(--ink)}
.check input{width:16px;height:16px;margin:0;flex:none;accent-color:var(--ink)}
.check input:checked + span{color:var(--ink);font-weight:500}
.diag{padding:12px 16px 14px;border-top:1px solid var(--line)}
.diag-toggle{font-size:13px;color:var(--ink-3);text-decoration:underline;text-underline-offset:3px}
.diag-toggle:hover{color:var(--ink)}
.diag-body{display:flex;flex-direction:column;gap:14px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.diag-q{display:flex;flex-direction:column;gap:6px}
.diag-q .t{font-size:13.5px;font-weight:600;color:var(--ink)}
.diag-res{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.diag-res b{color:var(--ink)}
.reset{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2);transition:border-color .12s,color .12s,background .12s}
.reset svg{width:14px;height:14px}
.reset:hover{border-color:var(--line-strong);color:var(--ink);background:var(--surface-2)}
.reset:active{transform:translateY(1px)}

/* résultat */
.summary{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.summary h2{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.015em}
.summary p{margin:4px 0 0;color:var(--ink-2)}
/* Le rappel de la question passe au-dessus et en petit : ce que le visiteur
   cherche, c'est le resultat, pas l'enonce de sa propre requete. */
.summary .ctx{margin:0 0 6px;color:var(--ink-2);font-size:13.5px;font-weight:600;letter-spacing:.01em;line-height:1.3}
.summary h2{font-variant-numeric:tabular-nums}
.steps{display:flex;flex-direction:column;position:relative}
.step{display:grid;grid-template-columns:44px minmax(0,1fr);gap:0 14px;position:relative;padding-bottom:18px}
.step::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500;background:var(--surface);border:2px solid var(--ink);color:var(--ink);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s}
.card:hover,.tcard:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(20,30,60,.06),0 18px 36px -14px rgba(20,30,60,.28);border-color:var(--line-strong)}
.card:focus-visible,.tcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card:active,.tcard:active{transform:translateY(-1px)}
.card-body{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px 20px;align-items:start}
@media (max-width:700px){.card-body{grid-template-columns:1fr}}
.card-body .pvbox{display:block;border-radius:8px;border:1px solid var(--line);overflow:hidden}
.card-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-top:12px;border-top:1px dashed var(--line)}
.card-foot .meta{border:0;padding:0;flex:1 1 420px;min-width:0;grid-template-columns:max-content fit-content(42%) minmax(0,1fr)}
@media (max-width:700px){.card-foot .meta{flex-basis:100%;grid-template-columns:1fr 1fr}.card-foot .actions,.card-foot .actions .btn{width:100%}.card-foot .actions .btn{justify-content:center}}
.card-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.card h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 45% var(--chip-text-l))}
.why{margin:0 0 10px;color:var(--ink);max-width:70ch}
.why b{font-weight:600}
.desc{margin:0;color:var(--ink-2);max-width:70ch}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;padding-top:12px;border-top:1px dashed var(--line);margin:0}
.meta div{font-size:13.5px;color:var(--ink-2)}
.meta dt{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.meta dd{margin:0;color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.phase-break{display:flex;align-items:center;gap:10px;margin:6px 0 14px 58px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.phase-break::after{content:"";flex:1;height:1px;background:var(--line)}
.aside{margin-top:26px;padding:16px 18px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.aside h3{font-size:15px;margin-bottom:8px}
.aside ul{margin:0;padding-left:18px;color:var(--ink-2)}
.aside li{margin:3px 0}
.aside li button{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* liste */
.list-wrap{overflow-x:auto;margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.list{border-collapse:collapse;width:100%;min-width:1020px;font-size:13.5px;table-layout:fixed}
.list td:nth-child(4){white-space:nowrap}
.list td:last-child{padding-left:6px;padding-right:10px}
.list td:last-child .btn{white-space:nowrap}
.list th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:500;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.list td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink-2)}
.list tr:last-child td{border-bottom:0}
.list tbody tr{cursor:pointer;transition:background .12s}
.list tbody tr:hover{background:var(--surface-2)}
.list tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.list td b{color:var(--ink);font-weight:600}
.list td.stages{min-width:150px}
.list td .actions{justify-content:flex-end}
.list .chip{white-space:normal;display:inline-block;line-height:1.25;text-align:left;padding:4px 10px}
/* bibliothèque et cards */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:24px}
.filters .sep{width:1px;height:22px;background:var(--line-strong);margin:0 4px}
.select{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 6px 0 12px;height:36px;font-size:13.5px;color:var(--ink-3)}
.select select{border:0;background:transparent;font:inherit;font-weight:600;color:var(--ink);padding:6px 4px;outline:none;max-width:240px;cursor:pointer}
.select:focus-within{border-color:var(--accent)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;height:36px;min-width:220px}
.search:focus-within{border-color:var(--accent)}
.search svg{flex:none;color:var(--ink-3)}
.search:focus-within svg{color:var(--ink-2)}
.search input{border:0;background:none;font:inherit;color:var(--ink);width:100%;outline:none}
.search input::placeholder{color:var(--ink-3)}
.count{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--ink-3);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:18px}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .16s ease,box-shadow .16s ease,border-color .16s}
.tcard .pvbox{display:block;border-radius:8px;border:1px solid var(--line);overflow:hidden}
.tcard h3{font-size:16px;font-weight:700}
.tcard p{margin:0;color:var(--ink-2);font-size:13.5px}
.tcard .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stags{display:flex;flex-wrap:wrap;gap:4px}
.stag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:.01em;line-height:1.4;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-strong)}
.tcard .actions{margin-top:auto;padding-top:6px}
.tcard .actions .btn{width:100%;justify-content:center;padding:10px 12px;font-size:13.5px}
.foot{margin-top:56px;padding-top:28px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:20px}
.foot-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,auto);gap:28px 48px;align-items:start}
.foot-col:last-child{justify-self:end;text-align:right;max-width:38ch}
.foot-col:last-child .foot-sub-text{max-width:none}
.foot-col:last-child .btn.primary{align-self:flex-end}
@media (max-width:700px){.foot-main{grid-template-columns:1fr;gap:24px}.foot-col:last-child{justify-self:stretch;text-align:left;max-width:none}.foot-col:last-child .btn.primary{align-self:flex-start}}
.foot-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.foot-lead{margin:0;font-size:14px;color:var(--ink-2);max-width:52ch;line-height:1.55}
.foot-legal a{color:var(--ink-2);font-weight:600;text-decoration:none}
.foot-legal a:hover{color:var(--ink);text-decoration:underline}
.foot-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.foot-links a{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500;color:var(--ink-2);text-decoration:none;transition:border-color .12s,color .12s,background .12s}
.foot-links a svg{width:15px;height:15px;color:var(--ink-3)}
.foot-links a:hover{border-color:var(--line-strong);color:var(--ink);background:var(--surface-2)}
.foot-links a:hover svg{color:var(--ink-2)}
.foot-sub-title{margin:0;font-size:14px;font-weight:600;color:var(--ink)}
.foot-sub-text{margin:0;font-size:14px;color:var(--ink-2);line-height:1.55;max-width:40ch}
.foot .btn.primary{align-self:flex-start;margin-top:4px;padding:11px 16px}
.foot-legal{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin:0;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3)}
.totop{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;display:inline-flex;align-items:center;gap:8px;padding:11px 16px 11px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:600;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s,border-color .12s}
.totop svg{width:15px;height:15px;color:var(--ink-3)}
.totop.on{opacity:1;transform:translateY(0)}
.totop:hover{border-color:var(--line-strong)}
.totop:active{transform:translateY(1px)}
@media (max-width:700px){.totop{right:14px;padding:12px 16px 12px 14px}}
@media print{.totop{display:none!important}}
.empty{padding:30px;text-align:center;color:var(--ink-3);border:1px dashed var(--line-strong);border-radius:14px}

/* panneau latéral */
dialog{border:0;padding:0;margin:0;background:var(--surface);color:var(--ink);position:fixed;inset:0 0 0 auto;width:min(620px,100vw);max-width:100vw;height:100%;max-height:100%;overflow:hidden;box-shadow:-24px 0 60px -30px rgba(0,0,0,.45);transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
dialog[open]{transform:translateX(0)}
dialog::backdrop{background:rgba(10,14,28,.35);transition:opacity .28s}
@starting-style{dialog[open]{transform:translateX(100%)}}
.dlg{height:100%;overflow-y:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
.dlg-pv{padding:20px 22px 0;background:var(--surface)}
.dlg-pv svg{border:1px solid var(--line);background:var(--pv-bg);border-radius:10px}
.dlg-body{padding:18px 22px 28px;display:flex;flex-direction:column;gap:12px}
.dlg-body h2{font-size:24px;font-weight:700;letter-spacing:-.01em}
.dlg .close{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.dlg .close svg{width:16px;height:16px}
.dlg .close:hover{background:var(--surface-2)}
.dlg-body .meta{border-top:1px dashed var(--line)}
.dlg-head{position:sticky;top:0;z-index:3;background:var(--surface);padding:12px 22px 0;border-bottom:1px solid var(--line)}
.dlg-head-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.dlg-nav{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.dlg-nav::-webkit-scrollbar{display:none}
.dlg-nav a{padding:8px 10px;font-size:13px;font-weight:600;color:var(--ink-3);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap}
.dlg-nav a:hover{color:var(--ink);border-bottom-color:var(--line-strong)}
.dlg-body section{scroll-margin-top:96px}
.dlg-body h3{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:10px}
.dlg-body h3 .total{font-size:12px;color:var(--ink-3);font-weight:400}
.dlg-body .desc,.dlg-body .why{margin:0 0 10px}
#sec-overview{display:flex;flex-direction:column;gap:2px}
#sec-overview .meta{margin:6px 0 14px}
#sec-overview .actions .btn{width:100%;justify-content:center;padding:13px 16px;font-size:15px;border-radius:12px}
#sec-overview .actions .btn svg{width:16px;height:16px}
#sec-overview .actions{margin-bottom:6px}
body:has(dialog[open]){overflow:hidden}
@media (prefers-reduced-motion:reduce){dialog{transition:none}}
.muted{color:var(--ink-3)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;font-size:12.5px}
.reasons .rl{color:var(--ink-3);margin-right:2px}
.reasons .rs{padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-weight:500}
.result-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin:0 0 18px}
.seg{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:9px;gap:2px}
.seg button{padding:5px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.plan-wrap{overflow-x:auto}
.plan-table{border-collapse:collapse;width:100%;min-width:640px;font-size:13.5px;table-layout:fixed}
.plan-table th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-weight:500;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.plan-table td{padding:12px 14px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
.plan-table th{padding-right:14px}
.plan-table td:last-child,.plan-table th:last-child{padding-right:0}
.plan-table tfoot td{border:0;font-weight:600}
.plan-table .mono{font-size:12.5px;white-space:nowrap}
.gantt{display:flex;flex-direction:column;min-width:520px;padding-right:16px}
.g-head,.g-row{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px;align-items:start}
.g-head span{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding-bottom:6px;border-bottom:1px solid var(--line)}
.g-phase{margin-top:8px;padding:6px 12px;border-radius:8px 8px 0 0;font-size:12.5px;font-weight:600;letter-spacing:.01em;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 45% var(--chip-text-l))}
.g-row{min-height:46px;padding:6px 0 6px;border-radius:0 0 8px 8px;background:hsl(var(--h) 50% calc(var(--chip-l) + 6%) / .45)}
.g-bar{display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:40px;padding:5px 9px;border-radius:8px;text-align:left;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 45% var(--chip-text-l));border:1px solid hsl(var(--h) 40% calc(var(--chip-l) - 10%));font-size:12px;line-height:1.2;overflow:hidden;transition:transform .12s,box-shadow .12s}
.g-bar b{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.g-bar small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.8}
.g-bar:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.g-cell{position:relative;width:calc(var(--frac) * 100%);min-width:64px;transition:width .12s ease}
.g-cell.dragging{transition:none}
.g-cell .g-bar{width:100%}
.g-cell--tight .g-bar{box-shadow:inset 0 0 0 1.5px #d79a4e}
.g-cell--hard .g-bar{box-shadow:inset 0 0 0 1.5px var(--warn-line)}
body.resizing{touch-action:none;user-select:none}
.g-grip{position:absolute;top:0;right:-5px;width:12px;height:100%;cursor:ew-resize;border-radius:0 8px 8px 0;touch-action:none}
.g-grip::after{content:"";position:absolute;top:50%;right:4px;width:3px;height:18px;margin-top:-9px;border-radius:2px;background:currentColor;opacity:.32}
.g-cell:hover .g-grip::after,.g-grip:focus-visible::after{opacity:.75}
.g-grip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.g-tip{position:fixed;z-index:60;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;max-width:260px;box-shadow:var(--shadow)}
.g-tip.warn{background:var(--warn-text)}
.gantt-hint{margin:8px 0 0;font-size:12px;color:var(--ink-3)}
@media print{.g-bar{box-shadow:none}.g-grip,.g-floor,.g-ghost,.edit-bar,.warn-list,.dur-ctl button{display:none!important}}
.howto{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.howto h3{font-size:16px}
.howto h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-weight:500;margin:8px 0 0}
.howto ul,.howto ol{margin:0;padding-left:18px;color:var(--ink-2);font-size:14px}
.howto li{margin:3px 0}
.howto p{margin:0;color:var(--ink-2);font-size:14px}
.agenda{list-style:none;padding:0}
.agenda li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px;margin:6px 0}
.agenda .amin{font-size:12px;color:var(--ink-3);padding-top:2px;white-space:nowrap}
.agenda b{color:var(--ink);font-weight:600}
.deps,.prep,.agenda-sec,.pitfalls-sec,.next-sec{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
/* Les autres sections finissent par du texte, dont l'interligne fait deja
   respirer le bas. Les pieges finissent par une carte bordee : son trait
   arrivait a 4px du filet suivant, d'ou ce rattrapage, ici seulement. */
.pitfalls-sec{padding-bottom:10px}
.pv-seg{margin-bottom:10px}
.zoom-btn{display:block;width:100%;cursor:zoom-in;border-radius:10px}
.zoom-btn svg{display:block;width:100%;height:auto}
dialog.zoom{position:fixed;inset:0;width:100vw;height:100%;max-width:100vw;max-height:100%;border:0;padding:0;margin:0;background:rgba(10,14,28,.92);transform:none;transition:none;cursor:zoom-out}
dialog.zoom::backdrop{background:transparent}
#zoom-content{height:100%;display:flex;flex-direction:column;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.zoom-head{display:flex;align-items:center;gap:12px;color:#B4BCCF;font-size:13px}
#zoom-content svg{flex:1;min-height:0;width:100%;height:100%;max-height:calc(100% - 40px);border-radius:12px}
.ex-intro{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--ink-3);margin:10px 0 0;line-height:1.45}
.ex-intro svg{width:18px;height:18px;flex:none;margin-top:1px}
.ex-context{font-size:14px;color:var(--ink-2);margin:10px 0 0;line-height:1.45}
.ex-take{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.ex-take b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-weight:500;margin-bottom:4px}
.ex-take p{margin:0;font-size:14px;color:var(--ink);line-height:1.45}
.dep-group{margin-bottom:10px}
.dep-group h4{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-weight:500;margin:0 0 6px}
.wchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wchip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px 5px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--ink);transition:border-color .12s,background .12s}
.wchip i{width:8px;height:8px;border-radius:50%;background:hsl(var(--h) 60% 55%);flex:none}
.wchip:hover{border-color:var(--accent);background:var(--accent-soft)}
.wchip.need{border-color:var(--ink);border-width:1.5px}
.wchip.help{border-style:dashed}
.info{width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong);color:var(--ink-3);font-size:11px;font-weight:600;font-family:"IBM Plex Mono",monospace;display:inline-grid;place-items:center;line-height:1;transition:background .12s,color .12s}
.info:hover,.info[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.info-note{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px;line-height:1.45;color:var(--ink-2)}
.req-list{display:flex;flex-direction:column;gap:8px}
.req-group{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding-left:12px;border-left:1.5px solid var(--line-strong)}
.req-group .conj{font-size:12px;color:var(--ink-3);font-style:italic;margin-bottom:1px}
.wchips .or{font-size:11px;color:var(--ink-3);font-family:"IBM Plex Mono",monospace}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.checklist label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;font-size:14px;color:var(--ink-2);cursor:pointer;line-height:1.45}
.checklist label:hover{background:var(--surface-2)}
.checklist input{width:16px;height:16px;margin:3px 0 0;flex:none;accent-color:var(--ink)}
.checklist input:checked + span{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.timebar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin:0 0 14px}
.timebar span{display:block;background:hsl(var(--h) calc(var(--chip-s) - 10%) calc(var(--chip-l) - 8% - var(--i) * 6%))}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.timeline li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::before{display:none}
.tl-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 45% var(--chip-text-l))}
.tl-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.tl-head b{font-weight:600;color:var(--ink)}
.tl-head .mono{font-size:12px;color:var(--ink-3);white-space:nowrap}
.tl-body p{margin:3px 0 0;color:var(--ink-2);font-size:14px;line-height:1.45}
.pitfalls{display:flex;flex-direction:column;gap:8px}
.pitfall{display:flex;gap:10px;align-items:flex-start;padding:11px 14px 9px;border-radius:12px;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn-text)}
.pitfall svg{width:16px;height:16px;flex:none;margin-top:2px}
.pitfall p{margin:0;font-size:14px;line-height:1.5;color:var(--warn-text)}
.pitfall svg{margin-top:3px}
.next-card{padding:12px 14px;border-radius:12px;background:hsl(var(--h) var(--chip-s) calc(var(--chip-l) + 5%) / .55);border:1px solid hsl(var(--h) 40% calc(var(--chip-l) - 10%))}
.next-card p{margin:0 0 10px;font-size:14px;line-height:1.45;color:var(--ink)}
.next-card .dep-group{margin:0}
.src{font-size:13px;margin:10px 0 0}
/* ---------- durees ajustees ---------- */
.g-cell{position:relative;width:calc(var(--frac) * 100%);min-width:10px;transition:width .12s ease}
/* Hors brouillon, le plan est un document : une barre ne descend jamais sous la
   largeur de son nom, quitte a ne plus etre exactement proportionnelle. En
   brouillon, l'inverse : la proportion prime, c'est elle qu'on manipule. */
.gantt:not(.gantt--draft) .g-cell{min-width:max-content;max-width:100%}
.g-cell.dragging{transition:none}
.g-cell .g-bar{width:100%;position:relative}
.g-cell--under .g-bar{box-shadow:inset 0 0 0 1.5px var(--alert-line);background:repeating-linear-gradient(135deg,hsl(var(--h) var(--chip-s) calc(var(--chip-l) + 2%)),hsl(var(--h) var(--chip-s) calc(var(--chip-l) + 2%)) 6px,hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 4%)) 6px,hsl(var(--h) var(--chip-s) calc(var(--chip-l) - 4%)) 12px)}
.g-cell--narrow .g-bar{padding:0 5px}
.g-cell--narrow .g-bar b{font-size:11px}
.g-cell--narrow .g-bar small,.g-cell--narrow .g-segs{display:none}
/* fantome de la duree standard, visible des que l'atelier est comprime */
.g-ghost{position:absolute;inset:0 auto 0 0;width:calc(var(--gw) * 100%);border:1px dashed var(--line-strong);border-radius:8px;pointer-events:none;opacity:var(--go,0);transition:opacity .12s}
/* repere de la duree conseillee, montre seulement quand on vise cette barre */
.g-floor{position:absolute;top:0;bottom:0;left:calc(var(--fx) * 100%);width:2px;background:var(--alert-line);opacity:0;transition:opacity .12s;pointer-events:none}
.g-bar:hover ~ .g-floor,.g-cell:focus-within .g-floor,.g-cell.dragging .g-floor{opacity:.9}
body.resizing{touch-action:none;user-select:none}
.g-grip{position:absolute;top:0;right:0;width:32px;height:100%;margin-right:-16px;cursor:ew-resize;touch-action:none;z-index:2;display:grid;place-items:center}
.g-grip::after{content:"";width:3px;height:18px;border-radius:2px;background:hsl(var(--h) 45% var(--chip-text-l));opacity:.3}
.g-row:hover .g-grip::after,.g-grip:focus-visible::after{opacity:.75}
.g-grip:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}
.g-cell--narrow .g-grip{width:20px;margin-right:-10px}
.g-segs{position:absolute;left:9px;right:9px;bottom:5px;display:flex;gap:1px;height:4px;border-radius:2px;overflow:hidden;opacity:0;transition:opacity .12s}
.g-bar:hover .g-segs,.g-cell:focus-within .g-segs,.g-cell.dragging .g-segs{opacity:1}
.g-segs i{background:hsl(var(--h) 45% var(--chip-text-l));opacity:.3;border-radius:1px;min-width:1px}
.g-segs i.seg-cut{opacity:.5}
.g-segs i.seg-floor{background:var(--alert-line);opacity:1}
.g-cap{position:absolute;top:100%;left:0;margin-top:calc(var(--lane, 0) * 17px - 2px);line-height:15px;white-space:nowrap;font-size:11.5px;font-weight:600;color:hsl(var(--h) 45% var(--chip-text-l));opacity:0;transition:opacity .12s;pointer-events:none}
.g-cap i{font-style:normal;font-size:10.5px;opacity:.75;margin-left:5px}
.g-cell--narrow .g-cap{opacity:1}
/* a droite de la barre quand la place le permet, dessous sinon */
.g-cell--capright .g-cap{top:50%;left:100%;transform:translateY(-50%);margin:0 0 0 8px}
/* le nom est ecrit a cote : dans la barre il ne resterait que des bouts de lettres */
.g-cell--capright .g-bar b{display:none}

/* barre d'actions du brouillon */
.edit-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.edit-bar--done{background:none}
.edit-count{flex:1 1 0;min-width:0;font-size:13px;color:var(--ink-2)}
/* le groupe reste solidaire : il passe a la ligne entier plutot que de se
   couper en deux, et se replie sur lui-meme quand l'ecran est trop etroit */
.freed{display:inline-block;margin-left:10px;font-size:12px;font-weight:600;color:var(--ink-2);padding:3px 9px;border-radius:7px;background:repeating-linear-gradient(135deg,transparent,transparent 5px,var(--line) 5px,var(--line) 6px),var(--surface)}
.edit-acts{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px;flex:0 1 auto}
.edit-bar .btn[disabled]{opacity:.35;pointer-events:none}
.btn.icon{padding:6px;width:32px;height:32px;justify-content:center}
.btn.icon svg{width:18px;height:18px;color:var(--ink-2)}
.btn.icon:hover svg{color:var(--ink)}
/* alertes : une ligne par atelier passe sous sa duree conseillee */
.warn-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.warn-list li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:7px 12px;border:1px solid var(--alert-line);background:var(--alert-soft);border-radius:10px;font-size:12.5px;color:var(--alert-text)}
.warn-list li::before{content:"△";font-size:12px;line-height:1;color:var(--alert-line)}
.warn-list b{font-weight:600}
.warn-list span{margin-right:auto}
/* menu du clic droit */
.ctx-menu{position:fixed;z-index:90;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;box-shadow:0 18px 44px -18px rgba(15,20,40,.4);display:flex;flex-direction:column}
.ctx-menu button{text-align:left;border:0;background:none;padding:7px 10px;border-radius:7px;font:inherit;font-size:12.5px;color:var(--ink);cursor:pointer}
.ctx-menu button:hover{background:var(--surface-2)}
.ctx-menu .danger{color:var(--alert-text)}
.sheet-foot{display:flex;justify-content:flex-end;margin-top:14px}
.btn.danger{color:#fff;border-color:var(--alert-solid);background:var(--alert-solid)}
.btn.danger:hover{filter:brightness(1.08);border-color:var(--alert-solid);background:var(--alert-solid)}
/* bulle du geste, calee sur la barre */
.g-tip{position:fixed;z-index:95;pointer-events:none;padding:7px 10px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;max-width:280px;box-shadow:var(--shadow)}
.g-tip.warn{background:var(--alert-text)}
.g-tip b{display:block;font-weight:600}
.g-tip em{display:block;margin-top:4px;font-style:normal;opacity:.85}
.plan-adjusted{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.plan-adjusted b{color:var(--ink)}
.dur-cell{white-space:nowrap}
.dur-ctl{display:inline-flex;align-items:center;gap:7px}
/* le total du pied de tableau se cale sous les valeurs, pas sous le bouton moins */
.dur-spacer{width:22px;flex:none}
/* le total se cale comme une valeur mais ne s'edite pas : ni survol, ni curseur texte */
.dur-ctl .dur-total{min-width:52px;text-align:center;font-weight:600;padding:1px 2px 2px}
.dur-ctl button{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink-2);border-radius:6px;cursor:pointer;font-size:13px;line-height:1}
.dur-ctl button:hover{color:var(--ink);border-color:var(--ink-3)}
.dur-ctl .dur-val{width:auto;height:auto;min-width:52px;display:inline;text-align:center;font-weight:600;border:0;border-bottom:1px dashed transparent;border-radius:0;background:none;color:var(--ink);font-size:inherit;padding:1px 2px 2px;cursor:text}
.dur-ctl .dur-val:hover{border-bottom-color:var(--ink-3);background:none}
.dur-in{width:70px;text-align:center;font-weight:600;font-size:13.5px;padding:1px 2px 2px;border:0;border-bottom:2px solid var(--accent);background:none;color:var(--ink);outline:none}
.plan-table:not(.editing) .dur-ctl button[data-dur]{opacity:0;transition:opacity .12s}
.plan-table:not(.editing) tr:hover .dur-ctl button[data-dur],
.plan-table:not(.editing) .dur-ctl button[data-dur]:focus-visible{opacity:1}
.risk{display:block;margin-top:3px;font-size:11.5px;color:var(--ink-3);white-space:normal}
.risk--alert{color:var(--alert-text);font-weight:600}
.total.adj{color:var(--ink-3);font-weight:400}
.tl-head .cut{color:#9a6a2a}
/* Le lien de source n'est pas une action : il garde le gris de sa ligne,
   le souligne suffit a dire qu'il est cliquable. */
.src a{color:inherit}
.run-btn{margin-left:auto}
dialog.run{position:fixed;inset:0;width:100vw;height:100%;max-width:100vw;max-height:100%;border:0;padding:0;margin:0;background:var(--bg);color:var(--ink);transform:none;transition:none}
dialog.run::backdrop{background:var(--bg)}
#run-content{height:100%}
.run-wrap{height:100%;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px));max-width:920px;margin:0 auto;gap:18px}
.run-top{display:flex;align-items:center;gap:12px}
.run-top .run-count{margin-left:auto;font-size:13px;color:var(--ink-3)}
.run-steps{display:flex;gap:3px;height:6px}
.run-steps span{display:block;border-radius:3px;background:var(--line)}
.run-steps span.past{background:hsl(var(--h) 45% 60%)}
.run-steps span.now{background:var(--ink)}
.run-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;min-height:0}
.run-step{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0}
.run-main h2{font-size:clamp(28px,5vw,48px);font-weight:800;letter-spacing:-.02em}
.run-desc{font-size:clamp(16px,2.2vw,20px);line-height:1.5;color:var(--ink-2);margin:0;max-width:60ch}
.run-clock-wrap{margin:10px 0}
.run-clock{font-size:clamp(56px,12vw,120px);font-weight:500;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.run-clock.over{color:var(--warn-text)}
.run-bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:12px;max-width:520px}
.run-bar div{height:100%;width:0;background:hsl(var(--h) 55% 50%);transition:width 1s linear}
.run-up{margin:8px 0 0;color:var(--warn-text);font-weight:600}
.run-tip{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn-text);max-width:640px}
.run-tip svg{width:16px;height:16px;flex:none;margin-top:3px}
.run-tip b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-family:"IBM Plex Mono",monospace;font-weight:500;margin-bottom:2px}
.run-tip p{margin:0;font-size:14px;line-height:1.45}
.run-bottom{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.run-bottom .btn{padding:12px 18px;font-size:15px}
.run-bottom .btn[disabled]{opacity:.4;cursor:default}
.who{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line)}
.who h4.k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:"IBM Plex Mono",monospace;font-weight:500;margin:0 0 8px}
.wchip.static{cursor:default;color:var(--ink-2)}
.wchip.static:hover{border-color:var(--line);background:var(--surface)}
.helpful{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:12px}
@media print{
  body{background:#fff;color:#000}
  .hdr,.side,.result-bar,.aside,.steps,.lang{display:none!important}
  .wrap{max-width:none;padding:0}
  .plan{border:0;box-shadow:none;padding:0}
  .plan-table{min-width:0}
}
@media (max-width:700px){
  /* cibles tactiles : 44 px pour les actions principales, 40 px pour le reste (Fitts) */
  .tabs button{padding:12px 16px}
  .lang button{padding:10px 0}
  .seg button{padding:10px 14px;font-size:13.5px}
  .opt{padding:11px 14px;font-size:14px}
  .opts.stack .opt{padding:12px 14px}
  .checklist label,.check{padding:11px 10px}
  .check input,.checklist input{width:20px;height:20px}
  .brief-try .try{padding:10px 12px}
  .send{padding:10px 10px 10px 16px}
  .send svg{width:24px;height:24px}
  .step-dot{padding-bottom:6px;font-size:11px}
  .step-dot::before{width:16px;height:16px}
  .step-track::before{top:7px}
  .stepper{gap:8px}
  .diag-toggle{display:inline-block;padding:10px 2px}
  .readout-x{width:40px;height:40px;margin:-8px -10px -8px 0}
  .reset{width:100%;justify-content:center;padding:12px 14px}
  .btn.small{padding:11px 14px;font-size:13.5px}
  .wchip{padding:9px 13px 9px 11px;font-size:13.5px}
  .deps li button,.aside li button,.cell button{display:inline-flex;align-items:center;min-height:40px}
  .acc summary{padding:16px 18px}
  .summary h2{font-size:clamp(26px,7.5vw,32px);letter-spacing:-.02em;line-height:1.1}
  .summary{display:block}
  .summary > div{width:100%}
  .brief summary{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:14px 16px}
  .brief .spark{grid-row:1}
  .brief-title{grid-row:1}
  .brief .chev{grid-row:1}
  .brief-sub{grid-column:2 / -1;grid-row:2}
  .dlg-nav a{padding:12px 10px}
  .info{width:32px;height:32px;font-size:13px}
  .dlg .close{width:40px;height:40px}
  .card-foot .actions .btn,.tcard .actions .btn{padding:13px 16px;font-size:14.5px}
  .select select,.search input,.brief textarea{font-size:16px}
  .select select{min-height:40px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center}
  .filters .seg{grid-column:1;justify-self:start}
  .filters .count{grid-column:2;grid-row:1;justify-self:end;margin:0}
  .filters .sep{display:none}
  .filters .search{grid-column:1 / -1;height:42px;min-width:0}
  .filters .select{height:42px;min-width:0}
  .filters .select select{flex:1;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function diagnose(a){
  // score par stade à partir des 6 réponses (index 0..2), puis équipe et manques déduits
  const sc = {idee:0, prepmf:0, postpmf:0, scale:0, mature:0};
  const [use, ret, teams, q, legacy, road] = a;
  if(use === 0){ sc.idee += 4; } if(use === 1){ sc.prepmf += 3; sc.postpmf += 1; } if(use === 2){ sc.postpmf += 1; sc.scale += 1; sc.mature += 2; }
  if(ret === 0){ sc.idee += 1; sc.prepmf += 2; } if(ret === 1){ sc.prepmf += 2; sc.postpmf += 1; } if(ret === 2){ sc.postpmf += 3; sc.scale += 1; sc.mature += 1; }
  if(teams === 0){ sc.prepmf += 1; sc.postpmf += 2; } if(teams === 1){ sc.scale += 3; } if(teams === 2){ sc.scale += 2; sc.mature += 2; }

  if(road === 0){ sc.idee += 1; sc.prepmf += 1; } if(road === 1){ sc.postpmf += 1; } if(road === 2){ sc.scale += 2; sc.mature += 1; }
  const answered = a.filter(v => v !== null).length;
  if(!answered) return null;
  const stage = Object.entries(sc).sort((x, y) => y[1] - x[1])[0][0];
  const team = teams === null ? null : ['s','m','l'][teams];
  const goals = [];
  if(q === 0){ goals.push('users','ideas'); } if(q === 2){ goals.push('process','align'); } if(q === 1){ goals.push('prio'); }
  if(road === 2) goals.push('align'); if(ret === 0 || ret === 1) goals.push('measure'); if(legacy === 2) goals.push('design');
  return {stage, team, goals:[...new Set(goals)], answered};
}

    + `<div class="diag-res"><span>${esc(d.suggested)} : <b>${r ? esc(L.stages[r.stage].name) : '…'}</b></span></div>`;
}
document.getElementById('diag').addEventListener('click', e => {
  if(e.target.closest('#diag-toggle')){ diag.open = !diag.open; store.set('diag', diag); renderDiag(); return; }
  const b = e.target.closest('[data-diag]'); if(!b) return;
  const i = +b.dataset.diag, v = +b.dataset.v;
  diag.a[i] = diag.a[i] === v ? null : v; store.set('diag', diag);
  const r = diagnose(diag.a);
  if(r){ ans.stage = r.stage; if(r.team) ans.team = r.team; if(diag.a[3] !== null && r.goals.length) ans.goals = r.goals; saveAns(); }
  renderDiag(); renderQuestions(); renderResult();
});
function syncUrl(){
  const url = new URL(location.href);
  ['stage','team','trigger','horizon'].forEach(k => url.searchParams.set(k, ans[k]));
  url.searchParams.set('goals', ans.goals.join(','));
  if(ans.pin.length) url.searchParams.set('pin', ans.pin.join(',')); else url.searchParams.delete('pin');
  if(ans.skip.length) url.searchParams.set('skip', ans.skip.join(',')); else url.searchParams.delete('skip');
  // « id:minutes », pour qu'un plan partage arrive avec ses durees
  const durs = Object.keys(durOv).map(k => k + ':' + Math.round(durOv[k] * 60)).join(',');
  if(durs) url.searchParams.set('durs', durs); else url.searchParams.delete('durs');
  if(view === 'plan') url.searchParams.set('view', 'plan'); else url.searchParams.delete('view');
  if(lang !== 'en') url.searchParams.set('lang', lang); else url.searchParams.delete('lang');
  url.searchParams.delete('open');
  history.replaceState(null, '', url);
  return url.href;
}
function saveAns(){ store.set('answers', ans); syncUrl(); }
let lib = {phase:'all', stage:'all', q:'', mode: store.get('libMode', 'cards')};

const byId = (arr, id) => arr.find(x => x.id === id);
const phaseIdx = id => PHASES.findIndex(p => p.id === id);
const stageIdx = id => STAGES.findIndex(s => s.id === id);
// Une journee ne s'affiche en jours que si le total en est vraiment une :
// depuis que les durees s'ajustent, arrondir 10 h en « 1 j » ferait mentir le plan.
// « 1 h 30 » plutot que « 1,5 h » : un facilitateur lit un creneau, pas un
// decimal. Les jours restent, mais seulement pour une vraie journee pleine.
const fmtDur = h => {
  const m = Math.round(h * 60), H = Math.floor(m / 60), M = m % 60, d = h / 7;
  if(h >= 7 && Math.abs(h - Math.round(d) * 7) < 0.25) return Math.round(d) + ' ' + UI().days;
  if(m < 60) return m + ' ' + UI().min;
  return M ? H + ' ' + UI().hours + ' ' + String(M).padStart(2, '0') : H + ' ' + UI().hours;
};


/* ---------- durees ajustees ----------
   Le catalogue porte une duree de reference par atelier, qui ne bouge jamais.
   Le facilitateur peut en poser une autre, en tirant la barre du plan ou depuis
   le tableau. Le plan vit alors en brouillon, avec ses avertissements, jusqu'a
   ce qu'il soit valide : un plan valide se lit comme un document. */
const STEPM = 5;
// le lien fait autorite, sinon on reprend ce que le navigateur avait garde
let durOv = urlDurs || store.get('durs', {});
let dirty = false, past = [], future = [];
const stepFor = t => t.dur >= 7 ? 3.5 : STEPM / 60;
const edur = t => durOv[t.id] != null ? durOv[t.id] : t.dur;
const rat = t => edur(t) / t.dur;
const content = t => (RUN && RUN[t.id] && RUN[t.id][lang]) || null;
/* Duree minimale conseillee : la somme des planchers de ses etapes. En dessous,
   l'atelier ne rend plus ce qu'il promet. On previent, on n'interdit pas. */
function recDur(t){
  const c = content(t);
  if(!c || !c.agenda) return t.dur * 0.5;
  return Math.ceil(c.agenda.reduce((s, a) => s + Math.max(STEPM, Math.round(a.min / 2)), 0) / STEPM) * STEPM / 60;
}
const hardDur = () => STEPM / 60;
const tooShort = t => edur(t) < recDur(t) - 0.001;
function saveDur(){ store.set('durs', durOv); syncUrl(); }
const snapDur = () => ({d: Object.assign({}, durOv), skip: ans.skip.slice()});
function restoreDur(st){ durOv = Object.assign({}, st.d); ans.skip = st.skip.slice(); }
function changeDur(fn){ past.push(snapDur()); future = []; fn(); dirty = true; saveDur(); saveAns(); renderQuestions(); renderResult(); }
function undoDur(){ if(!past.length) return; future.push(snapDur()); restoreDur(past.pop()); saveDur(); saveAns(); renderQuestions(); renderResult(); }
function redoDur(){ if(!future.length) return; past.push(snapDur()); restoreDur(future.pop()); dirty = true; saveDur(); saveAns(); renderQuestions(); renderResult(); }
/* Comprimer tout au meme facteur raboterait aussi l'etape qui produit la
   decision. La premiere, la derniere et la plus longue sont protegees, le milieu
   absorbe, avec un plancher a la moitie de la reference et jamais moins de cinq
   minutes. Sous la somme des planchers, tout retrecit au prorata. */
function scaleAgenda(agenda, targetMin){
  const ref = agenda.reduce((s, a) => s + a.min, 0);
  const out = agenda.map(a => ({t: a.t, d: a.d, min: a.min, ref: a.min}));
  if(!targetMin || !ref || Math.abs(targetMin - ref) < 1){ out.forEach(a => { a.cut = false; }); return out; }
  if(targetMin > ref){
    const k = targetMin / ref;
    out.forEach(a => { a.min = Math.max(1, Math.round(a.min * k)); });
  } else {
    const floor = a => Math.max(STEPM, Math.round(a.ref / 2));
    const sum = () => out.reduce((s, a) => s + a.min, 0);
    const take = pool => {
      const cap = pool.reduce((s, a) => s + Math.max(0, a.min - floor(a)), 0), need = sum() - targetMin;
      if(cap <= 0 || need <= 0) return;
      const want = Math.min(need, cap);
      pool.forEach(a => { const c = Math.max(0, a.min - floor(a)); if(!c) return; a.min = Math.max(floor(a), a.min - Math.round(want * c / cap)); });
    };
    if(targetMin < out.reduce((s, a) => s + floor(a), 0)){
      const k = targetMin / ref;
      out.forEach(a => { a.min = Math.max(1, Math.round(a.ref * k)); });
    } else {
      let big = 0; out.forEach((a, i) => { if(a.ref > out[big].ref) big = i; });
      take(out.filter((a, i) => i !== 0 && i !== out.length - 1 && i !== big));
      take(out);
    }
  }
  const diff = targetMin - out.reduce((s, a) => s + a.min, 0);
  if(diff > 0){ const b = out.reduce((m, a) => a.min > m.min ? a : m, out[0]); b.min += diff; }
  out.forEach(a => { a.cut = a.min < a.ref; });
  return out;
}
/* Nommer une etape suppose que le lecteur ait l'agenda en tete : on compte
   celles qui touchent leur plancher, et la barre montre lesquelles. */
function riskLineFor(t, hours){
  const u = UI(), r = hours / t.dur;
  if(Math.abs(r - 1) < 0.001) return '';
  const pct = Math.round(Math.abs(1 - r) * 100), sign = r < 1 ? '-' : '+';
  const c = content(t);
  if(!c || !c.agenda || r > 1) return sign + pct + '%';
  const floorSum = c.agenda.reduce((s, a) => s + Math.max(STEPM, Math.round(a.min / 2)), 0);
  if(Math.round(hours * 60) < floorSum) return sign + pct + '% · ' + u.broken;
  const sc = scaleAgenda(c.agenda, Math.round(hours * 60));
  const n = sc.filter(a => a.cut && a.min <= Math.max(STEPM, Math.round(a.ref / 2))).length;
  return n ? sign + pct + '% · ' + u.atFloor(n) : sign + pct + '%';
}
const riskLine = t => riskLineFor(t, edur(t));
const inPlan = t => !!(lastPick && lastPick.some(x => x.t.id === t.id));
const breaksOf = t => { const c = content(t); return c && c.breaks ? c.breaks : ''; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pv = t => Preview.renderPreview(LAYOUTS[t.id], {class:'pv', title:UI().preview(tx(t).name)});
const figjamUrl = t => FIGJAM.file && FIGJAM.nodes[t.id] ? `https://www.figma.com/board/${FIGJAM.file}/${encodeURIComponent(FIGJAM.name)}?node-id=${encodeURIComponent(FIGJAM.nodes[t.id].replace(':', '-'))}` : '';
const ICON = {
  undo: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 6.5H12a4 4 0 0 1 0 8H7"/><path d="M10 3.5 6.5 6.5 10 9.5"/></svg>',
  redo: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 6.5H8a4 4 0 0 0 0 8h5"/><path d="M10 3.5 13.5 6.5 10 9.5"/></svg>',
  figjam:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h7v7M13 3 7 9"/><path d="M11 9v4H3V5h4"/></svg>',
  x:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  warn:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5 14 13H2z"/><path d="M8 6.5v3M8 11.5v.2"/></svg>',
  play:'<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>',
  info:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4M8 5v.2"/></svg>',
  up:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7v7H2V7zM5 7l3-5c1 0 2 .7 2 2v3h3.2a1 1 0 0 1 1 1.2l-1 5a1 1 0 0 1-1 .8H5"/></svg>',
  down:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 9V2h3v7zM11 9l-3 5c-1 0-2-.7-2-2V9H2.8a1 1 0 0 1-1-1.2l1-5a1 1 0 0 1 1-.8H11"/></svg>',
};
const stageTags = t => `<span class="stags">${STAGES.map((s, i) => t.fit[i] === 3 ? `<span class="stag">${esc(L.stages[s.id].short)}</span>` : '').join('')}</span>`;
function actionsHtml(t, small){

  const fj = url ? `<a class="${cls} primary" href="${url}" target="_blank" rel="noopener">${ICON.figjam}${esc(UI().openFigjam)}</a>`
                 : `<span class="${cls} primary" aria-disabled="true">${ICON.figjam}${esc(UI().figjamSoon)}</span>`;

/* ---------- moteur ---------- */
// ordre du parcours : un atelier vient après ses prérequis présents dans le plan (needs, et au moins un membre de chaque groupe anyOf représenté) ; départage par phase puis score
function orderByDeps(pick){
  const inPlan = new Set(pick.map(x => x.t.id));
  const blockers = x => {
    const c = CHAIN[x.t.id] || {}, b = [];
    (c.needs || []).forEach(id => { if(inPlan.has(id)) b.push([id]); });
    (c.anyOf || []).forEach(g => { const present = g.filter(id => inPlan.has(id)); if(present.length) b.push(present); });
    return b; // liste de groupes : chaque groupe doit avoir au moins un membre déjà placé
  };
  const out = [], placed = new Set(); let rest = pick.slice();
  while(rest.length){
    const ready = rest.filter(x => blockers(x).every(g => g.some(id => placed.has(id))));
    const pool = ready.length ? ready : rest; // cycle improbable : on débloque par phase
    pool.sort((x, y) => phaseIdx(x.t.phase) - phaseIdx(y.t.phase) || y.s - x.s);
    const next = pool[0]; out.push(next); placed.add(next.t.id); rest = rest.filter(x => x !== next);
  }
  return out;
}
function recommend(a){
  const si = stageIdx(a.stage);
  const team = byId(TEAMS, a.team).size;
  const cap = byId(HORIZONS, a.horizon).cap;
  const scored = T.map(t => {
    const fit = t.fit[si];
    if((a.skip || []).includes(t.id)) return null;
    const pinned = (a.pin || []).includes(t.id);
    if(fit === 0 && !pinned) return null;
    if(t.minTeam && team < t.minTeam && !pinned) return null;
    let s = Math.max(fit, pinned ? 3 : 0) * 3 + (pinned ? 10 : 0);
    const gm = t.goals.filter(g => a.goals.includes(g)).length;
    s += Math.min(gm, 2) * 2;
    if(t.triggers.includes(a.trigger)) s += 3;
    if(a.horizon === 'demi' && t.dur > 4) s -= 6;
    if(a.horizon === 'semaine' && t.dur > 8) s -= 3;
    return {t, s, fit};
  }).filter(Boolean);
  scored.sort((x, y) => y.s - x.s || phaseIdx(x.t.phase) - phaseIdx(y.t.phase));
  const min = a.horizon === 'programme' ? 8 : 9;
  let pick = [];
  if(a.horizon === 'programme'){
    PHASES.forEach(p => { const best = scored.find(x => x.t.phase === p.id && x.s >= min); if(best) pick.push(best); });
    scored.forEach(x => { if(pick.length < cap && !pick.includes(x) && x.s >= min) pick.push(x); });
  } else pick = scored.filter(x => x.s >= min).slice(0, cap);
  if(pick.length === 0) pick = scored.slice(0, Math.min(cap, 3));
  scored.forEach(x => { if((a.pin || []).includes(x.t.id) && !pick.includes(x)) pick.push(x); });
  pick = orderByDeps(pick);
  // raisons par étape + chaînage
  const ids = pick.map(x => x.t.id), u = UI(), st = L.stages[a.stage].short;
  pick.forEach((x, i) => {
    const r = [];
    r.push(x.fit === 3 ? u.reasons.core(st) : u.reasons.fit(st));
    if(x.t.triggers.includes(a.trigger)) r.push(u.reasons.trigger);
    const g = x.t.goals.filter(g => a.goals.includes(g)).map(g => L.goals[g].toLowerCase());
    if(g.length) r.push(u.reasons.goals(g.join(', ')));
    const feeds = pick.slice(i + 1).find(y => chainInputs(y.t.id).includes(x.t.id));
    if(feeds) r.push(u.reasons.feeds(tx(feeds.t).name));
    const builds = pick.slice(0, i).find(y => chainInputs(x.t.id).includes(y.t.id));
    if(builds && !feeds) r.push(u.reasons.builds(tx(builds.t).name));
    x.reasons = r;
  });
  // prérequis sautés : un "needs" absent du plan, ou un groupe "anyOf" dont aucun membre n'est dans le plan
  const prereqs = [];
  const ok = t => t && t.fit[si] >= 1 && !(t.minTeam && team < t.minTeam);
  pick.forEach(x => {
    const c = CHAIN[x.t.id] || {};
    (c.needs || []).forEach(id => { if(ids.includes(id)) return; const t = byId(T, id); if(ok(t) && !prereqs.some(p => p.from.id === id)) prereqs.push({from: t, to: x.t}); });
    (c.anyOf || []).forEach(group => {
      if(group.some(id => ids.includes(id))) return;
      const best = group.map(id => byId(T, id)).filter(ok).sort((p, q) => q.fit[si] - p.fit[si])[0];
      if(best && !prereqs.some(p => p.from.id === best.id)) prereqs.push({from: best, to: x.t});
    });
  });
  return {pick, scored, prereqs: prereqs.slice(0, 3)};
}

/* ---------- plan (roadmap partageable) ---------- */
function planSlots(pick){
  // demi : une session ; semaine : un atelier par jour ; programme : ~1 atelier par semaine, les longs (design sprint, PI) prennent 2 semaines
  const u = UI();
  if(ans.horizon === 'demi') return pick.map((x, i) => ({label:u.slotSession, x, start:i, span:1}));
  if(ans.horizon === 'semaine') return pick.map((x, i) => ({label:u.slotDay(i + 1), x, start:i, span:1}));
  // programme : on remplit chaque semaine jusqu'à ~6 h de facilitation ; un atelier de 2 jours ou plus occupe 2 semaines seul
  let week = 0, used = 0; return pick.map(x => {
    const d = edur(x.t);
    if(d >= 14){ if(used > 0){ week++; used = 0; } const slot = {label:u.slotWeek(week + 1), x, start:week, span:2}; week += 2; used = 0; return slot; }
    if(used > 0 && used + d > 6){ week++; used = 0; }
    const slot = {label:u.slotWeek(week + 1), x, start:week, span:1}; used += d; return slot;
  });
}
function ganttHtml(slots){
  const u = UI();
  const n = slots.reduce((m, s) => Math.max(m, s.start + s.span), 0);
  // Une semaine de programme a une capacite reelle, six heures de facilitation.
  // Ailleurs, une colonne est un creneau : la pleine largeur revient au plus long
  // atelier du plan, pour que les barres se comparent entre elles.
  const cap = ans.horizon === 'programme' ? 6 : Math.max(1, ...slots.map(s => edur(s.x.t)));
  const cols = Array.from({length:n}, (_, i) => ans.horizon === 'demi' ? `${u.slotSession} ${i + 1}` : ans.horizon === 'semaine' ? u.slotDay(i + 1) : u.slotWeek(i + 1));
  const phases = PHASES.filter(p => slots.some(s => s.x.t.phase === p.id));
  let html = `<div class="gantt${dirty ? ' gantt--draft' : ''}" style="--n:${n}" data-cap="${cap}" data-n="${n}"><div class="g-head">${cols.map(c => `<span>${esc(c)}</span>`).join('')}</div>`;
  phases.forEach(p => {
    html += `<div class="g-phase" style="--h:var(${p.h})">${esc(L.phases[p.id])}</div><div class="g-row" style="--h:var(${p.h})">`;
    slots.filter(s => s.x.t.phase === p.id).forEach(s => {
      const t = s.x.t, x = tx(t), d = edur(t), span = cap * s.span;
      const frac = Math.max(0.03, Math.min(1, d / span));
      const gw = Math.max(0.03, Math.min(1, t.dur / span));
      const fx = Math.max(0.03, Math.min(1, recDur(t) / span));
      const short = dirty && tooShort(t);
      html += `<div class="g-cell${short ? ' g-cell--under' : ''}" style="grid-column:${s.start + 1} / span ${s.span};--frac:${frac.toFixed(4)};--gw:${(gw / frac).toFixed(4)};--fx:${(fx / frac).toFixed(4)}" data-cell="${t.id}">
        <div class="g-ghost" style="--go:${dirty && d < t.dur - 0.001 ? 1 : 0}"></div>
        <button type="button" class="g-bar" data-open="${t.id}" title="${esc(x.name)} · ${fmtDur(d)}"><b>${esc(x.name)}</b><small>${fmtDur(d)}</small><span class="g-segs">${segsHtml(t, d)}</span></button>
        <div class="g-floor"></div>
        <span class="g-grip" data-grip="${t.id}" role="slider" tabindex="0" aria-label="${esc(x.name)} · ${esc(u.dur)}" aria-valuetext="${esc(fmtDur(d))}" title="${esc(u.dragHint)}"></span>
        <span class="g-cap"><b>${esc(x.name)}</b><i class="mono">${fmtDur(d)}</i></span>
      </div>`;
    });
    html += `</div>`;
  });
  return html + `</div>`;
}
/* L'agenda de l'atelier, en segments proportionnels : on voit lesquels se
   resserrent en tirant, sans avoir a connaitre la fiche. */
function segsHtml(t, hours){
  const c = content(t);
  if(!c || !c.agenda) return '';
  const sc = scaleAgenda(c.agenda, Math.round(hours * 60));
  return sc.map(a => {
    const floor = Math.max(STEPM, Math.round(a.ref / 2));
    const cls = a.cut && a.min <= floor ? 'seg-floor' : a.cut ? 'seg-cut' : '';
    return `<i style="flex:${a.min}"${cls ? ` class="${cls}"` : ''} title="${esc(a.t + ' · ' + a.min + ' min' + (a.cut ? ' (' + UI().refTime + ' ' + a.ref + ')' : ''))}"></i>`;
  }).join('');
}
/* Une barre trop courte n'a plus la place d'ecrire son nom : il passe dessous,
   et deux etiquettes voisines se repartissent sur plusieurs niveaux. */
function ganttCaptions(){
  document.querySelectorAll('.g-row').forEach(row => {
    const cells = [...row.querySelectorAll('.g-cell')].sort((a, b) =>
      a.querySelector('.g-bar').getBoundingClientRect().left - b.querySelector('.g-bar').getBoundingClientRect().left);
    const lanes = [], rowRight = row.getBoundingClientRect().right;
    cells.forEach((cell, i) => {
      const bar = cell.querySelector('.g-bar'), cap = cell.querySelector('.g-cap');
      // une barre est etroite quand son nom deborde vraiment, pas quand il
      // frole le bord : sinon on affichait une etiquette en double
      const lbl = bar.querySelector('b');
      const narrow = lbl.scrollWidth > lbl.clientWidth + 1;
      cell.classList.toggle('g-cell--narrow', narrow);
      cell.classList.remove('g-cell--capright');
      cap.style.removeProperty('--lane');
      if(!narrow) return;
      // d'abord a droite de la barre, comme un titre de clip ; on n'ecrit
      // dessous que si la place manque jusqu'a la barre suivante ou au bord
      const br = bar.getBoundingClientRect();
      const next = cells[i + 1] ? cells[i + 1].querySelector('.g-bar').getBoundingClientRect().left : rowRight;
      if(cap.offsetWidth + 16 <= next - br.right){ cell.classList.add('g-cell--capright'); return; }
      let lane = 0;
      while(lanes[lane] != null && br.left < lanes[lane]) lane++;
      lanes[lane] = br.left + cap.offsetWidth + 10;
      cap.style.setProperty('--lane', lane);
    });
    row.style.paddingBottom = lanes.length ? (lanes.length * 17 + 12) + 'px' : '';
  });
}
function planHtml(pick, total){
  const u = UI();
  const ref = pick.reduce((s, x) => s + x.t.dur, 0);
  const slots = planSlots(pick);

    return `<tr><td class="mono">${esc(s.label)}</td>

  const warnList = warns.length ? `<ul class="warn-list">${warns.map(s => {

    return `<li><b>${esc(tx(t).name)}</b>${b ? `<span>${esc(b)}</span>` : '<span></span>'}</li>`;
  }).join('')}</ul>` : '';
  return `<section class="plan">

    ${warnList}
    <div class="plan-wrap" style="margin-top:18px"><table class="plan-table${dirty ? ' editing' : ''}"><colgroup><col style="width:9%"><col style="width:27%"><col style="width:19%"><col style="width:21%"><col style="width:24%"></colgroup><thead><tr><th>${esc(u.slotWhen)}</th><th>${esc(u.slotWhat)}</th><th>${esc(u.dur)}</th><th>${esc(u.who)}</th><th>${esc(u.out)}</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td></td><td>${esc(u.total)}</td><td class="dur-cell"><span class="dur-ctl"><span class="dur-spacer"></span><b class="dur-total mono">${fmtDur(total)}</b></span></td><td colspan="2"></td></tr></tfoot></table></div>
    <div class="who"><h4 class="k">${esc(u.whoAvailable)}</h4><div class="wchips">${[...new Set(pick.map(x => tx(x.t).who))].map(w => `<span class="wchip static">${esc(w)}</span>`).join('')}</div></div>
  </section>`;

/* ---------- regler la duree d'un atelier ----------
   Trois chemins : tirer la barre, les boutons du tableau, la saisie au clavier.
   Tous passent par changeDur, donc tous font entrer le plan en brouillon. */
function parseDur(str){
  const v = String(str).toLowerCase().replace(',', '.').trim();
  let m = v.match(/^(\d+(?:\.\d+)?)\s*h\s*(\d{1,2})?$/);
  if(m) return (+m[1]) + (m[2] ? +m[2] / 60 : 0);
  m = v.match(/^(\d+)\s*[:h]\s*(\d{1,2})$/);
  if(m) return (+m[1]) + (+m[2]) / 60;
  m = v.match(/^(\d+(?:\.\d+)?)\s*(?:min|m)?$/);
  // un nombre nu se lit en minutes, un nombre a virgule en heures
  if(m){ const n = +m[1]; return /\./.test(v) ? n : n / 60; }
  return null;
}
function typeDur(btn){
  const t = byId(T, btn.dataset.type);
  const inp = document.createElement('input');
  inp.className = 'dur-in mono'; inp.value = btn.textContent.trim();
  inp.setAttribute('aria-label', UI().dur + ' · ' + tx(t).name);
  btn.replaceWith(inp); inp.focus(); inp.select();
  const done = ok => {
    if(done.fired) return; done.fired = true;
    const val = ok ? parseDur(inp.value) : null;
    if(val == null || !isFinite(val) || val <= 0) return renderResult();
    changeDur(() => { durOv[t.id] = Math.max(hardDur(), Math.min(t.dur * 2, Math.round(val * 60) / 60)); });
  };
  inp.addEventListener('keydown', ev => {
    if(ev.key === 'Enter'){ ev.preventDefault(); done(true); }
    if(ev.key === 'Escape'){ ev.preventDefault(); done(false); }
  });
  inp.addEventListener('blur', () => done(true));
}
let gdrag = null, lastDragEnd = 0;
function gTip(html, warn, bar){

  el.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.right - w / 2)) + 'px';
  el.style.top = (r.top - h - 10 >= 8 ? r.top - h - 10 : r.bottom + 10) + 'px';

const gTipHide = () => { const el = document.getElementById('g-tip'); if(el) el.remove(); };
function gLive(t, hours){
  const cell = document.querySelector(`[data-cell="${t.id}"]`);
  if(!cell) return;
  const g = cell.closest('.gantt'), cap = +g.dataset.cap;
  const span = cap * (+(cell.style.gridColumn.match(/span (\d+)/) || [0, 1])[1]);
  const frac = Math.max(0.03, Math.min(1, hours / span));
  cell.style.setProperty('--frac', frac.toFixed(4));
  cell.style.setProperty('--gw', (Math.max(0.03, Math.min(1, t.dur / span)) / frac).toFixed(4));
  cell.style.setProperty('--fx', (Math.max(0.03, Math.min(1, recDur(t) / span)) / frac).toFixed(4));
  const sm = cell.querySelector('.g-bar small'); if(sm) sm.textContent = fmtDur(hours);
  const cp = cell.querySelector('.g-cap i'); if(cp) cp.textContent = fmtDur(hours);
  const sg = cell.querySelector('.g-segs'); if(sg) sg.innerHTML = segsHtml(t, hours);
  const gh = cell.querySelector('.g-ghost'); if(gh) gh.style.setProperty('--go', hours < t.dur - 0.001 ? 1 : 0);

}
document.addEventListener('pointerdown', e => {
  const grip = e.target.closest('[data-grip]'); if(!grip) return;
  const t = byId(T, grip.dataset.grip), cell = grip.closest('.g-cell'), row = cell.parentElement;
  const g = cell.closest('.gantt'), n = +g.dataset.n, gap = 6;
  const colPx = (row.clientWidth - gap * (n - 1)) / n;
  gdrag = {t, startX: e.clientX, startDur: edur(t), cap: +g.dataset.cap, colPx, cell, cur: edur(t)};
  cell.classList.add('dragging');
  // au doigt, le navigateur prend la main pour faire defiler des le second
  // mouvement : on lui retire le geste tant qu'on redimensionne
  document.body.classList.add('resizing');
  grip.setPointerCapture(e.pointerId);
  e.preventDefault();
});
document.addEventListener('touchmove', e => { if(gdrag) e.preventDefault(); }, {passive: false});
document.addEventListener('pointercancel', () => { if(gdrag){ document.body.classList.remove('resizing'); gdrag.cell.classList.remove('dragging'); gdrag = null; gTipHide(); renderResult(); } });
document.addEventListener('pointermove', e => {
  if(!gdrag) return;
  const u = UI(), t = gdrag.t, step = stepFor(t), reco = recDur(t);
  let raw = gdrag.startDur + ((e.clientX - gdrag.startX) / gdrag.colPx) * gdrag.cap;
  // le seuil conseille accroche : il faut insister pour passer dessous
  const stickH = (30 / gdrag.colPx) * gdrag.cap;
  if(raw < reco && raw > reco - stickH) raw = reco;
  else if(raw <= reco - stickH) raw += stickH;
  const val = Math.max(hardDur(), Math.min(t.dur * 2, Math.round(raw / step) * step));
  gdrag.cur = val;
  gLive(t, val);
  const short = val < reco - 0.001, line = riskLineFor(t, val), b = breaksOf(t);
  const hurts = short || /·/.test(line);
  gTip('<b>' + esc(fmtDur(val) + (short ? ' · ' + u.reco(fmtDur(reco)) : line ? ' · ' + line : '')) + '</b>'
    + (hurts && b ? '<em>' + esc(b) + '</em>' : ''), short, gdrag.cell.querySelector('.g-bar'));
});
document.addEventListener('pointerup', () => {
  if(!gdrag) return;
  const d = gdrag; gdrag = null; lastDragEnd = Date.now(); gTipHide();
  document.body.classList.remove('resizing');
  d.cell.classList.remove('dragging');
  if(Math.abs(d.cur - d.startDur) > 0.001) changeDur(() => { durOv[d.t.id] = Math.round(d.cur * 60) / 60; });

});
